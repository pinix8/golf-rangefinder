<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>골프 거리측정</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="골프거리">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #0b1a12; --panel: #12291c; --line: #24442f; --text: #eef5f0; --muted: #9db8a6;
    --accent: #7ee08a; --warn: #ffcc4d; --bad: #ff6b6b; --btn: #1d3d2a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body, button { touch-action: manipulation; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }   /* 빠른 연타가 확대(더블탭 줌)로 먹히지 않게 */
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  body { display: flex; flex-direction: column; overscroll-behavior: none; }
  button { font: inherit; color: var(--text); background: var(--btn); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  button:active { transform: scale(.97); }
  button.primary { background: #2f7d45; border-color: #3f9a58; font-weight: 700; }
  button.on { background: var(--accent); color: #062010; font-weight: 700; }
  select, input[type=text] { font: inherit; background: var(--btn); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px; }

  header { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 6px) 10px 6px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  header .hole { flex: 1; min-width: 0; text-align: center; cursor: pointer; }
  header .hole b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .hole b { font-size: 20px; }
  header .hole small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button { padding: 8px 10px; font-size: 16px; flex: 0 0 auto; }
  html, body { overflow: hidden; }   /* 페이지 전체가 스크롤되면 아래 버튼 탭이 스크롤로 오인되어 먹힘 → 화면 한 장에 고정 */
  body { height: 100vh; height: 100dvh; }
  .gps { font-size: 11px; padding: 3px 6px; border-radius: 6px; background: #333; white-space: nowrap; }
  .gps.good { background: #1f6b35; } .gps.mid { background: #7a6312; } .gps.bad { background: #7a1f1f; }

  #map { flex: 1; min-height: 120px; background: #000; }
  .banner { position: absolute; top: 6px; left: 6px; z-index: 801; width: max-content;   /* 왼쪽 정렬 — 오른쪽 버튼(내 위치·홀 보기)과 안 겹치게 */
    background: rgba(0,0,0,.78); padding: 6px 8px; border-radius: 10px; font-size: 13px; text-align: center; max-width: calc(100vw - 16px); }
  .banner .chips { margin-top: 5px; display: flex; gap: 4px; justify-content: center; flex-wrap: nowrap; }
  .banner .chips button { padding: 6px 8px; font-size: 13px; white-space: nowrap; }
  .mapwrap { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .fab { position: absolute; right: 10px; z-index: 800; padding: 8px 10px; font-size: 13px; background: rgba(18,41,28,.9); }

  #panel { background: var(--panel); border-top: 1px solid var(--line); padding: 8px 10px calc(env(safe-area-inset-bottom) + 14px); flex: 0 1 auto;
    min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  /* 큰 글씨 설정 등으로 패널이 화면보다 길면 패널만 스크롤되고, 타수·퍼트 줄은 항상 화면 아래에 붙어 보임 */
  .score { position: sticky; bottom: calc(-1 * (env(safe-area-inset-bottom) + 14px)); z-index: 5; background: var(--panel);
    padding: 4px 0 calc(env(safe-area-inset-bottom) + 14px); margin-bottom: calc(-1 * (env(safe-area-inset-bottom) + 14px)); }
  #map { flex-shrink: 1; }
  .dist { display: flex; align-items: stretch; gap: 8px; }
  .big { flex: 1.3; text-align: center; background: #0d2016; border-radius: 12px; padding: 4px 0; }
  .big .lbl { font-size: 12px; color: var(--muted); }
  .big .num { font-size: 52px; font-weight: 800; line-height: 1.05; color: var(--accent); font-variant-numeric: tabular-nums; }
  .fcb { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
  .fcb div { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 8px;
    background: #0d2016; border-radius: 8px; font-variant-numeric: tabular-nums; }
  .fcb span { color: var(--muted); font-size: 13px; } .fcb b { font-size: 20px; }
  .live { display: flex; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--muted); }
  .live div { flex: 1; background: #0d2016; border-radius: 8px; padding: 4px 8px; }
  .live b { color: var(--text); font-size: 16px; font-variant-numeric: tabular-nums; }
  .lastshot { margin-top: 6px; background: #0d2016; border-radius: 8px; padding: 6px 10px; font-size: 15px; display: none; }
  .lastshot b { color: var(--accent); font-size: 20px; font-variant-numeric: tabular-nums; }
  .counter.hl { outline: 2px solid var(--accent); animation: pulse 1s ease-in-out 3; }
  @keyframes pulse { 50% { outline-color: transparent; } }
  .big.nogreen { cursor: pointer; }
  .big.nogreen .num { font-size: 22px; padding: 12px 0; color: var(--warn); }
  .shots { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 16px; white-space: nowrap; overflow-x: auto; }
  .actions { display: flex; gap: 6px; margin-top: 6px; }
  #holeDoneBtn { width: 100%; margin-top: 6px; padding: 12px 6px; font-size: 16px; }
  /* 그린 미등록: 큰 거리판·핀 줄·홀 전장 칸을 접고 한 줄 안내만 → 지도(티~그린 공 궤적)를 크게 */
  #noGreenBar { display: none; background: #0d2016; border: 1px solid #5a4a14; color: var(--warn); border-radius: 10px; padding: 8px 10px; font-size: 14px; cursor: pointer; }
  #panel.nogreen .dist, #panel.nogreen .live > div:first-child { display: none; }
  #panel.nogreen #noGreenBar { display: block; }
  #panel.nogreen.noshot .live { display: none; }
  .actions button { flex: 1; padding: 11px 4px; font-size: 14px; }
  .score { display: flex; gap: 8px; margin-top: 6px; }
  .counter { flex: 1; display: flex; align-items: center; justify-content: space-between; background: #0d2016;
    border-radius: 10px; padding: 3px; }
  .counter span { font-size: 13px; color: var(--muted); padding-left: 4px; white-space: nowrap; }
  /* 좁은 화면·큰 글씨 설정에서도 ＋−가 화면 밖으로 밀리지 않게: 칸이 줄어듦 */
  /* 왼쪽: 타수·퍼트 두 줄 / 오른쪽: 오늘 핀 위치 3×3 (그린을 바라본 방향 — 위가 뒤, 아래가 앞) */
  .score { align-items: stretch; }
  .cnts { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .cnts .counter { flex: 1 1 auto; min-width: 0; }
  .pingrid { flex: 0 0 132px; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 3px;
    background: #2a5e3a; border-radius: 10px; padding: 3px; }
  .pingrid button { padding: 0; font-size: 12px; border-radius: 6px; min-height: 28px; touch-action: none; background: #1d3d2a; }
  .pingrid button.on { background: #ffd76a; color: #3a2a00; }
  @media (max-width: 330px) { .pingrid { flex-basis: 108px; } .pingrid button { font-size: 11px; } }
  .counter button { flex: 1 1 50px; max-width: 64px; }
  .counter b { flex: 0 1 auto; }
  @media (max-width: 380px) { .counter button { min-width: 36px; padding: 4px 2px; } .counter b { min-width: 24px; font-size: 22px; } .counter span { font-size: 12px; padding-left: 2px; } }
  .counter b { font-size: 24px; min-width: 40px; text-align: center; }
  .score .counter b { cursor: pointer; text-decoration: underline dotted 1px; text-underline-offset: 5px; }   /* 누르면 직접 입력 화면 */
  .counter button { touch-action: none; min-width: 50px; min-height: 46px; padding: 4px 8px; font-size: 22px; font-weight: 700; user-select: none; -webkit-user-select: none; }

  .sheet { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,.6); display: none; }
  .sheet.show { display: flex; align-items: flex-end; }
  .sheet .box { background: var(--panel); width: 100%; max-height: 88vh; overflow: auto; border-radius: 16px 16px 0 0;
    padding: 14px 14px calc(env(safe-area-inset-bottom) + 14px); }
  .sheet h3 { margin: 4px 0 10px; }
  .sheet .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  .sheet .row > * { flex: 1; }
  .list button { display: block; width: 100%; text-align: left; margin: 6px 0; }
  table.card { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  table.card th, table.card td { border: 1px solid var(--line); padding: 5px 3px; text-align: center; }
  table.card th { background: #0d2016; color: var(--muted); font-weight: 500; }
  table.card tr.sum td { font-weight: 700; background: #0d2016; }
  .under { color: #6cc4ff; } .over { color: #ff9d7a; }
  .holegrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .holegrid div { background: #0d2016; border-radius: 8px; padding: 6px; font-size: 13px; }
  .muted { color: var(--muted); font-size: 12px; }
  /* 알림은 화면 위쪽(지도 위)에, 터치는 통과 — 알림이 떠 있는 동안 아래 버튼(타수·퍼트 등)이 먹통 되지 않게 */
  #flowCard { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 1001; display: none; background: rgba(10,25,17,.94);
    border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; font-size: 13px; cursor: pointer; }
  .shots, .lastshot { cursor: pointer; }
  .toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 64px); transform: translateX(-50%); z-index: 3000; background: rgba(0,0,0,.85);
    padding: 10px 16px; border-radius: 10px; display: none; font-size: 15px; pointer-events: none; width: max-content; max-width: 92vw; }

  .leaflet-container { background: #111; }
  .lbl-tip { background: rgba(0,0,0,.75); color: #fff; border: 0; font-weight: 700; font-size: 13px; }
  .lbl-tip::before { display: none; }
  .shot-tip { font-size: 12px; padding: 2px 6px; }
  #reviewBar { position: fixed; left: 8px; right: 8px; top: 64px; z-index: 1500; display: none; background: rgba(15,30,22,.93);
    border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 14px; }
  #reviewBar button { flex: 1 1 auto; padding: 6px 8px; font-size: 13px; }
</style>
</head>
<body>

<header>
  <button id="prevHole" aria-label="이전 홀">◀</button>
  <div class="hole" id="holeTitle"><b>골프 거리측정</b><small>코스를 선택하세요</small></div>
  <button id="nextHole" aria-label="다음 홀">▶</button>
  <span class="gps" id="gpsBadge">GPS …</span>
  <button id="menuBtn" aria-label="메뉴">☰</button>
</header>

<div class="mapwrap">
  <div id="map"></div>
  <div class="banner" id="banner" style="display:none"></div>
  <button class="fab" id="centerBtn" style="top:10px">◎ 내 위치</button>
  <button class="fab" id="fitBtn" style="top:50px">⛳ 홀 보기</button>
  <button class="fab" id="endBtn" style="top:90px;display:none">🏁 끝내기</button>
  <button class="fab" id="photoBtn" style="top:130px;display:none">📷 샷 사진</button>
</div>

<div id="panel">
  <div id="noGreenBar">📍 그린 위치 미등록 <span class="muted">· 여기를 누르거나 지도에서 그린을 탭해 등록 (등록하면 핀까지 거리)</span></div>
  <div class="dist">
    <div class="big"><div class="lbl" id="pinLbl">핀까지</div><div class="num" id="dPin">—</div></div>
    <div class="fcb">
      <div><span>앞</span><b id="dF">—</b></div>
      <div><span>중</span><b id="dC">—</b></div>
      <div><span>뒤</span><b id="dB">—</b></div>
    </div>
  </div>
  <div class="live">
    <div>홀 전장 (티→핀)<br><b id="dHole">—</b></div>
    <div>이번 샷 비거리 (직전 지점→나)<br><b id="dLast">—</b></div>
  </div>
  <div class="lastshot" id="lastShot"></div>
  <div class="shots" id="shotList"></div>
  <div class="score">
    <div class="cnts">
      <div class="counter"><span id="strokesLbl" style="cursor:pointer">타수</span><button data-c="strokes" data-d="-1">−</button><b id="strokes">0</b><button data-c="strokes" data-d="1">＋</button></div>
      <div class="counter" id="puttBox"><span id="puttsLbl" style="cursor:pointer">퍼트</span><button data-c="putts" data-d="-1">−</button><b id="putts">0</b><button data-c="putts" data-d="1">＋</button></div>
    </div>
    <div class="pingrid" id="pinGrid" aria-label="오늘 핀 위치 (골퍼가 그린을 바라본 방향)"><button data-pin="100" data-lr="-1">뒤좌</button><button data-pin="100" data-lr="0">뒤중</button><button data-pin="100" data-lr="1">뒤우</button><button data-pin="50" data-lr="-1">중좌</button><button data-pin="50" data-lr="0">중중</button><button data-pin="50" data-lr="1">중우</button><button data-pin="0" data-lr="-1">앞좌</button><button data-pin="0" data-lr="0">앞중</button><button data-pin="0" data-lr="1">앞우</button></div>
  </div>
  <button id="holeDoneBtn" class="primary" style="display:none"></button>
  <div class="actions">
    <button id="teeBtn">⛳ 티샷 위치</button>
    <button id="shotBtn" class="primary">● 샷 위치 기록</button>
    <button id="undoBtn">↶ 취소</button>
  </div>
</div>

<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="osm.js?v=21"></script>
<script>
'use strict';

// ---------- 저장소 ----------
const KEY = 'golfRangefinder.v1';
const APP_VER = 'v47';   // sw.js CACHE 버전과 함께 올림 — 메뉴 하단에 표시(휴대폰에 새 버전이 받아졌는지 확인용)
const store = load();
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.courses) return s;
  } catch (e) { /* 손상된 데이터는 새로 시작 */ }
  return { courses: {}, round: null, history: [], unit: 'm' };
}
// 라운드 내용이 실제로 바뀐 저장만 「마지막 기록 시각」으로 남김 (로그인·설정 저장으로 갱신되지 않게)
let lastRoundJson = store.round ? JSON.stringify({ ...store.round, touched: 0 }) : null;
function save() {
  if (store.round) {
    const j = JSON.stringify({ ...store.round, touched: 0 });
    if (j !== lastRoundJson) { store.round.touched = Date.now(); lastRoundJson = j; }
  } else lastRoundJson = null;
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { toast('저장 실패: 저장공간 확인'); }
}

// ---------- 거리 계산 ----------
function haversine(a, b) {
  const R = 6371008.8, rad = Math.PI / 180;
  const dLat = (b[0] - a[0]) * rad, dLng = (b[1] - a[1]) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmt(m) {
  if (m == null || !isFinite(m)) return '—';
  return store.unit === 'yd' ? Math.round(m * 1.09361) : Math.round(m);
}
function unitLbl() { return store.unit === 'yd' ? 'yd' : 'm'; }
function lerp(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }

// ---------- 상태 접근 ----------
const round = () => store.round;
const course = () => round() && store.courses[round().courseId];
const holeIdx = () => round() ? round().hole : 0;
const holeDef = () => course() && course().holes[holeIdx()];
const holeRec = () => round() && round().holes[holeIdx()];

function pinPoint() {
  return holeDef() ? pinOf(holeDef().green, holeRec().pin, holeRec().pinLR, pinFrom(holeDef(), holeRec())) : null;
}

// ---------- 지도 ----------
const map = L.map('map', { zoomControl: false, attributionControl: true, zoomSnap: 0.25 }).setView([37.5, 127.0], 16);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 21, maxNativeZoom: 19, crossOrigin: true, attribution: 'Esri World Imagery'
}).addTo(map);
const layers = L.layerGroup().addTo(map);
const meMarker = L.circleMarker([0, 0], { radius: 8, color: '#fff', weight: 3, fillColor: '#2b8cff', fillOpacity: 1 });
const meAcc = L.circle([0, 0], { radius: 1, color: '#2b8cff', weight: 1, fillOpacity: .12 });
let measure = null; // 지도 탭 측정 지점

// ---------- GPS ----------
let me = null, meAccM = null, firstFix = true;
const samples = [];
// 정확도 가중 평균 (가중치 1/acc²) + 중앙값에서 멀리 튄 값 제거
function fusePoints(pts) {
  if (!pts.length) return null;
  const med = [pts.map(s => s.p[0]).sort((a, b) => a - b)[pts.length >> 1], pts.map(s => s.p[1]).sort((a, b) => a - b)[pts.length >> 1]];
  const best = Math.min(...pts.map(s => s.acc));
  const keep = pts.length >= 3 ? pts.filter(s => haversine(s.p, med) <= Math.max(best * 1.5, 3)) : pts;
  const use = keep.length ? keep : pts;
  let w = 0, lat = 0, lng = 0;
  for (const s of use) { const k = 1 / Math.max(s.acc, 1) ** 2; w += k; lat += s.p[0] * k; lng += s.p[1] * k; }
  // n개 독립 측정 평균 → 오차가 대략 1/√n로 줄어듦 (단, GPS 오차는 시간상 상관이 있어 하한을 둠)
  const acc = Math.max(best / Math.sqrt(use.length), best * 0.6);
  return { p: [lat / w, lng / w], acc, n: use.length, best };
}
function startGps() {
  if (!('geolocation' in navigator)) { setBadge('GPS 없음', 'bad'); return; }
  navigator.geolocation.watchPosition(pos => {
    const raw = [pos.coords.latitude, pos.coords.longitude];
    meAccM = pos.coords.accuracy;
    if (meAccM <= 60) samples.push({ p: raw, acc: meAccM, t: Date.now() });
    while (samples.length && Date.now() - samples[0].t > 10000) samples.shift();
    // 실시간 위치: 최근 4초 측정 중 현재 위치와 일치하는(정지 상태) 것만 평균 → 숫자 흔들림 감소, 걷는 중엔 최신값
    const recent = samples.filter(s => Date.now() - s.t <= 4000 && haversine(s.p, raw) <= Math.max(meAccM, 3));
    const f = recent.length >= 2 ? fusePoints(recent) : null;
    me = f ? f.p : raw;
    setBadge('±' + Math.round(meAccM) + 'm', meAccM <= 6 ? 'good' : meAccM <= 15 ? 'mid' : 'bad');
    meMarker.setLatLng(me).addTo(map);
    meAcc.setLatLng(me).setRadius(meAccM).addTo(map);
    if (firstFix) { firstFix = false; fitHole(); }
    autoHoleCheck();
    render();
  }, err => {
    setBadge(err.code === 1 ? '위치권한 거부' : 'GPS 오류', 'bad');
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
}

    const rd = store.history[review.hi], rec = rd.holes[review.i], g = rd.courseSnapshot.holes[review.i].green;
    drawHole(g, pinOf(g, rec.pin, rec.pinLR, pinFrom(rd.courseSnapshot.holes[review.i], rec)), rec.shots); return;
  }
  const h = holeDef(); if (!h) return;
  const pin = pinPoint();
  const shots = holeRec().shots;
  drawHole(h.green, pin, shots);
  if (measure) {
    const ref = me || (shots.length ? shots[shots.length - 1].p : null);
    const lines = [];
    if (ref) { L.polyline([ref, measure], { color: '#7ee08a', weight: 3 }).addTo(layers); lines.push(`나→여기 ${fmt(haversine(ref, measure))}`); }
    if (pin) { L.polyline([measure, pin], { color: '#ffd84d', weight: 3 }).addTo(layers); lines.push(`여기→핀 ${fmt(haversine(measure, pin))}`); }
    L.circleMarker(measure, { radius: 7, color: '#000', weight: 2, fillColor: '#7ee08a', fillOpacity: 1 })
      .bindTooltip(lines.join('<br>') || '측정점', { permanent: true, direction: 'top', className: 'lbl-tip', offset: [0, -8] }).addTo(layers);
  }
}

// 그린 등록용 넓은 지도: 티(없으면 첫 샷·지금 위치)를 중심으로 홀 길이(파3 190·파4 400·파5 520m) 반경,
// 이미 친 샷이 있으면 그 방향 앞쪽으로 치우쳐서 → 그린이 화면 안에 들어오게
function setupViewBox() {
  const h = holeDef(), r = holeRec(); if (!h || !r) return null;
  const start = h.tee || (r.shots[0] && r.shots[0].p) || me; if (!start) return null;
  const len = h.par === 3 ? 190 : h.par >= 5 ? 520 : 400;
  const last = r.shots.length >= 2 ? r.shots[r.shots.length - 1].p : null;
  let ctr = start, rad = len;
  if (last && haversine(start, last) > 30) { ctr = lerp(start, last, Math.min(1.6, len * 0.55 / haversine(start, last))); rad = len * 0.6; }
  return { ctr, rad };
}
function setupView() {
  const v = setupViewBox(); if (!v) return false;
  const dLat = v.rad / 110540, dLon = v.rad / (111320 * Math.cos(v.ctr[0] * Math.PI / 180));
  try { map.fitBounds([[v.ctr[0] - dLat, v.ctr[1] - dLon], [v.ctr[0] + dLat, v.ctr[1] + dLon]], { padding: [6, 6] }); } catch (e) { /* 지도 크기 0(숨김) */ }
  return true;
}
const greenSetupWide = () => setup && setup !== 'tee' && !(holeDef() && holeDef().green && holeDef().green.c);
function fitHole() {
  if (greenSetupWide() && setupView()) return;   // 그린 등록 중이고 아직 그린이 없으면 넓게
  const h = holeDef();
  const pts = [];
  if (h && h.green) ['f', 'c', 'b'].forEach(k => h.green[k] && pts.push(h.green[k]));
  if (h && h.tee) pts.push(h.tee);
  const shots = holeRec() ? holeRec().shots : [];
  shots.forEach(s => pts.push(s.p));   // 지금까지 친 궤적 전체가 보이게
  const ctr = course() && course().center;
  if (!pts.length && ctr && (!me || haversine(me, ctr) > 3000)) { map.setView(ctr, 16); return; }
  if (me && (!pts.length || haversine(me, pts[0]) < 800)) pts.push(me);
  if (pts.length > 1) map.fitBounds(pts, { padding: [40, 40], maxZoom: 19 });
  else if (pts.length) map.setView(pts[0], 18);
}

// ---------- 그린 설정 모드 ----------
let setup = null; // 'f' | 'c' | 'b' | 'tee'
const SETUP_NAME = { f: '그린 앞', c: '그린 중앙', b: '그린 뒤', tee: '티잉그라운드' };
const SETUP_SHORT = { c: '중앙', f: '앞', b: '뒤', tee: '티' };
function enterSetup(key) {
  if (!course()) { toast('먼저 라운드를 시작하세요'); return; }
  setup = key || 'c';

}
function showBanner() {
  const el = document.getElementById('banner');
  if (!setup) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  // 작게(지도 가운데 그린을 가리지 않게): 안내 한 줄 + 버튼 한 줄
  el.innerHTML = `<div>${holeIdx() + 1}번홀 <b>${SETUP_NAME[setup]}</b> 탭${greenSetupWide() ? ' <span style="opacity:.8">· 그린을 찾아 탭하면 확대</span>' : ''}</div>
    <div class="chips">
      ${['c', 'f', 'b', 'tee'].map(k => `<button data-setup="${k}" class="${k === setup ? 'on' : ''}">${SETUP_SHORT[k]}</button>`).join('')}
      <button data-setup="here">📍여기</button>
      <button data-setup="done" class="primary">완료</button>
    </div>`;
}
function setPoint(key, p) {
  const h = holeDef();
  const first = key === 'c' && !(h.green && h.green.c);
  if (key === 'tee') h.tee = p;
  else { h.green = h.green || {}; h.green[key] = p; }
  save();
  if (first) { try { map.setView(p, 19); } catch (e) { /* 무시 */ } toast('그린으로 확대했습니다 — 중앙이 어긋났으면 「그린 중앙」을 눌러 다시 탭, 이어서 앞·뒤를 탭하세요', 4000); }
  const order = ['c', 'f', 'b'];

}
document.getElementById('banner').addEventListener('click', e => {
  const k = e.target.dataset && e.target.dataset.setup; if (!k) return;
  if (k === 'done') { setup = null; showBanner(); fitHole(); return; }
  if (k === 'here') { if (me) setPoint(setup, me.slice()); else toast('GPS 신호 대기 중'); return; }
  setup = k; showBanner();
});
map.on('click', e => {
  const p = [e.latlng.lat, e.latlng.lng];

  if (!course()) return;

// ---------- 샷 기록 ----------
document.getElementById('teeBtn').addEventListener('click', async () => {

  // 온그린 지점을 기록하면 티부터 그린까지 날아온 궤적 전체를 지도에 맞춰 보여 줌

// ---------- 핀 위치 ----------
function setPin(v, lr) { const r = holeRec(); if (!r) return; r.pin = v; r.pinLR = lr || 0; save(); render(); }

// ---------- 타수/퍼트 ----------
function bindTap(el, fn) {   // 터치: 떼는 순간 실행(20px 넘게 움직이면 무시), 그 뒤 오는 click은 건너뜀
  let down = null, viaTouch = 0;
  el.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') down = { x: e.clientX, y: e.clientY }; });
  el.addEventListener('pointercancel', () => { down = null; });
  el.addEventListener('pointerup', e => {
    if (!down || e.pointerType === 'mouse') return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
    if (moved > 20) return;
    viaTouch = Date.now(); fn();
  });
  el.addEventListener('click', () => { if (Date.now() - viaTouch < 1500) return; fn(); });
}
document.querySelectorAll('[data-c]').forEach(b => bindTap(b, () => {
  if (!needRound()) return;
  const r = holeRec(), k = b.dataset.c;
  if (navigator.vibrate) navigator.vibrate(10);
  r[k] = Math.max(0, (parseInt(r[k], 10) || 0) + (+b.dataset.d));
  if (k === 'strokes') r.manual = true;          // 타수를 직접 바꾸면 자동 계산 중지 (OB·벌타 등)
  else autoStrokes(r);
  if (k === 'putts' && r.putts > r.strokes) r.strokes = r.putts;
  save(); render();
  const el = document.getElementById(k); el.style.color = 'var(--accent)'; setTimeout(() => { el.style.color = ''; }, 250);
}));

// ---------- 타수·퍼트 직접 입력 화면 — 숫자를 누르면 큰 버튼으로 바로 입력 (샷 기록 없이도, 지난 홀도) ----------
let qsHole = 0;
const scoreName = (s, par) => s === 1 ? '홀인원' : ({ '-3': '알바트로스', '-2': '이글', '-1': '버디', 0: '파', 1: '보기', 2: '더블', 3: '트리플' })[s - par] || (s - par > 0 ? `+${s - par}` : '');

}
function scoreSheet(i) {
  if (!needRound()) return;
  const rd = round();
  qsHole = i == null ? holeIdx() : (i + 18) % 18;
  const r = rd.holes[qsHole], par = course().holes[qsHole].par, auto = !r.manual && r.shots.length >= 2;
  const sMax = Math.max(par + 5, 9, r.strokes);
  const sBtn = s => `<button data-act="qsS" data-id="${s}" class="${s === r.strokes ? 'on' : ''}" style="padding:10px 2px;line-height:1.15"><b style="font-size:20px">${s}</b><br><small>${scoreName(s, par)}</small></button>`;
  const pBtn = p => `<button data-act="qsP" data-id="${p}" class="${p === r.putts ? 'on' : ''}" style="padding:12px 2px;font-size:20px;font-weight:700">${p}</button>`;
  const empty = rd.holes.map((h, k) => !h.strokes && k < holeIdx() ? k + 1 : 0).filter(Boolean);
  openSheet(`<div class="row" style="margin:0 0 6px"><button data-act="qsHole" data-id="-1" style="flex:0 0 auto">◀</button>
      <h3 style="margin:0;text-align:center">${qsHole + 1}번홀 · Par ${par}${qsHole === holeIdx() ? '' : ' <small class="muted">(지난 홀 입력)</small>'}</h3>
      <button data-act="qsHole" data-id="1" style="flex:0 0 auto">▶</button></div>
    <p style="margin:6px 0 4px"><b>타수</b> <span class="muted">${auto ? '지금은 샷 기록으로 자동 계산 중 — 숫자를 누르면 직접 입력으로 바뀝니다' : r.manual ? '직접 입력' : '숫자를 누르세요'}</span></p>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">${Array.from({ length: sMax }, (_, k) => sBtn(k + 1)).join('')}</div>

    ${r.manual && r.shots.length >= 2 ? `<div class="list"><button data-act="qsAuto">📍 샷 기록으로 자동 계산 (${r.shots.length - 1 + r.putts}타)</button></div>` : ''}
    ${empty.length ? `<p style="color:var(--warn);margin:8px 0 0">미입력: ${empty.join('·')}번홀 — ◀로 가서 입력</p>` : ''}
    <div class="row"><button data-act="qsClear">지우기</button><button data-act="close" class="${r.strokes && qsHole === holeIdx() ? '' : 'primary'}">✓ 닫기</button></div>
    ${r.strokes && qsHole === holeIdx() ? `<div class="list" style="margin:0"><button data-act="qsNext" class="primary">✅ ${qsHole + 1}번홀 끝 — ${qsHole < 17 ? `${qsHole + 2}번홀로 ▶` : '라운드 끝내기'}</button></div>` : ''}`);
}
function qsSet(k, v) {
  const r = round().holes[qsHole];
  if (k === 's') { r.strokes = v; r.manual = true; if (r.putts > v) r.putts = v; }
  else if (k === 'p') { r.putts = v; if (r.manual) { if (v > r.strokes) r.strokes = v; } else { autoStrokes(r); if (v > r.strokes) r.strokes = v; } }
  else if (k === 'auto') { r.manual = false; autoStrokes(r); }
  else if (k === 'clear') { r.strokes = 0; r.putts = 0; r.manual = false; }
  if (navigator.vibrate) navigator.vibrate(15);

bindTap(document.getElementById('holeDoneBtn'), () => {

});
document.getElementById('noGreenBar').addEventListener('click', () => { if (course()) enterSetup('c'); });

// ---------- 홀 이동 ----------
function goHole(d, auto) {

  rd.hole = (rd.hole + d + 18) % 18; measure = null;
  save(); render(); fitHole(); showBanner();

  if (d > 0) showFlowCard(leaving);   // 앞으로 넘어갈 때 방금 끝낸 홀 요약 그림
  else { const fc = document.getElementById('flowCard'); if (fc) fc.style.display = 'none'; }
}
function swipeTip() {   // ◀▶ 버튼을 처음 쓸 때 한 번만: 쓸어 넘기기도 된다고 안내
  if (store.swipeTip) return;
  setTimeout(() => {   // 다른 안내(그린 미등록·자동 넘김 등)가 떠 있으면 덮지 않고 다음 기회에
    if (store.swipeTip || document.getElementById('toast').style.display === 'block') return;
    store.swipeTip = 1; save();
    toast('💡 아래 거리·타수 화면을 좌우로 쓸어도 홀이 넘어갑니다 (← 다음 홀 · → 이전 홀)', 4000);
  }, 2600);
}
document.getElementById('prevHole').addEventListener('click', () => { goHole(-1); swipeTip(); });
document.getElementById('nextHole').addEventListener('click', () => { goHole(1); swipeTip(); });
// 좌우로 쓸어 홀 넘기기 — 아래 패널·위 헤더에서 (지도는 끌어서 이동하므로 제외, 핀 슬라이더·샷 목록에서 시작한 쓸기도 제외)
// 손가락을 왼쪽으로 = 다음 홀, 오른쪽으로 = 이전 홀. 직접 이동이므로 GPS 자동 넘김은 잠시 멈춤
let swipe = null;
function swipeStart(e) {
  const t = e.changedTouches && e.changedTouches[0];

}
function swipeEnd(e) {
  const t = e.changedTouches && e.changedTouches[0], s0 = swipe; swipe = null;
  if (!t || !s0 || !round() || review || setup) return;
  const dx = t.clientX - s0.x, dy = t.clientY - s0.y;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5 || Date.now() - s0.at > 800) return;
  store.swipeTip = 1;
  goHole(dx < 0 ? 1 : -1);
  if (navigator.vibrate) navigator.vibrate(15);

}
['panel', 'holeTitle'].forEach(id => {

// ---------- 골프장 검색 (OpenStreetMap) ----------
const osmState = { query: '', results: [], picked: null, nines: [] };
function osmSearchSheet(msg) {
  openSheet(`<h3>🔎 골프장 검색</h3>
    <div class="row"><input type="text" id="osmQ" placeholder="예: 남서울, 아난티 중앙" value="${esc(osmState.query)}" enterkeyhint="search">

      : '관리자가 등록한 골프장에서 검색합니다. 없는 골프장은 관리자에게 추가를 요청하세요.'}</p>
    <div id="osmOut">${msg || ''}</div>
    <div class="list"><button data-act="courses">← 코스 목록</button></div>`);
  const q = document.getElementById('osmQ');
  q.addEventListener('keydown', e => { if (e.key === 'Enter') osmRunSearch(); });
  if (!msg) setTimeout(() => { if (q.isConnected) q.focus(); }, 50);
}
// 골프장 파 데이터 검색 — 로그인 후 서버(Supabase)에서 받아 auth.js가 setParDb로 채움(휴대폰 캐시로 오프라인 동작)
const PAR_DB = window.GOLF_PAR_DB || [];
function setParDb(list) { PAR_DB.length = 0; PAR_DB.push(...list); enforceMemberPars(); }
// 권한: 골프장 추가·파 수정은 관리자만. 일반 회원은 서버 DB 골프장으로 라운드·그린 위치 등록·기록 저장만 가능
// (서버는 RLS로 막혀 있고, 이 화면 제한은 회원 휴대폰 안의 사본까지 서버 파와 같게 유지하기 위함)
const canEdit = () => !!(window.GolfAuth && GolfAuth.isAdmin());
const ADMIN_ACTS = new Set(['newCourse', 'ncCreate', 'osmPick', 'osmCreate', 'osmManual', 'parApply', 'holePar', 'dbReset']);
function enforceMemberPars() {   // 회원 기기: 서버 DB 코스의 파를 서버 값으로 되돌리고 직접 수정값 제거
  if (canEdit() || !PAR_DB.length) return;
  let changed = !!store.dbFix;
  delete store.dbFix;
  Object.values(store.courses).forEach(c => {
    if (!c.src || !c.src.startsWith('db:') || !c.nines) return;
    const base = PAR_DB.find(x => x.name === c.src.slice(3)); if (!base) return;
    c.nines.forEach((label, half) => {
      const n = base.nines.find(x => x.label === label); if (!n) return;
      n.pars.forEach((p, k) => { const h = c.holes[half * 9 + k]; if (h && h.par !== p) { h.par = p; changed = true; } });
    });
  });
  if (changed) { save(); render(); }
}
const normName = s => String(s || '').toLowerCase().replace(/\s+/g, '')
  .replace(/(컨트리클럽|골프클럽|골프앤리조트|골프리조트|골프장|리조트|cc|gc|countryclub|golfclub)$/, '');
function searchParDb(q) {
  const k = normName(q);
  if (!k) return [];
  // 정확히 일치 > 앞부분 일치 > 포함 순으로 정렬 (DB가 커져 짧은 검색어에 여러 곳이 걸림)
  const rank = v => v === k ? 0 : v.startsWith(k) ? 1 : v.includes(k) ? 2 : (v.length >= 3 && k.startsWith(v)) ? 3 : 9;
  return PAR_DB.map((c, i) => ({ c, i, r: Math.min(...[c.name, ...(c.aliases || [])].map(n => rank(normName(n)))) }))
    .filter(x => x.r < 9).sort((a, b) => a.r - b.r || a.c.name.localeCompare(b.c.name, 'ko'))
    .map(({ c, i }) => ({ c, i }));
}
async function osmRunSearch() {
  const q = document.getElementById('osmQ').value.trim();
  if (!q) return;
  osmState.query = q;
  const out = document.getElementById('osmOut');
  const db = searchParDb(q);
  const dbHtml = db.length
    ? `<p><b>📋 파 정보 내장</b></p><div class="list">${db.map(({ c, i }) =>
        `<button data-act="dbPick" data-id="${i}">⛳ ${esc(c.name)} <span class="muted">· ${c.nines.length * 9}홀${c.verified ? '' : ' · 확인 필요'}</span></button>`).join('')}</div>`
    : '';
  if (!canEdit()) {   // 회원: 서버에 등록된 골프장만 (새 골프장 추가는 관리자에게 요청)
    out.innerHTML = dbHtml || `<p>「${esc(q)}」 골프장을 찾지 못했습니다. 이름을 짧게 (예: 「레이크사이드」) 다시 검색하세요. 없는 골프장은 관리자에게 추가를 요청하세요.</p>`;
    return;
  }
  out.innerHTML = dbHtml + '<p class="muted">OpenStreetMap 검색 중… (그린 위치 포함 가능)</p>';
  try {
    osmState.results = await GolfOSM.searchCourses(q);
  } catch (e) {
    osmState.results = null;
  }
  if (!document.getElementById('osmOut') || osmState.query !== q) return;
  const r = osmState.results;
  const osmHtml = r === null ? '<p class="muted">OpenStreetMap 서버가 응답하지 않습니다.</p>'
    : r.length ? `<p><b>🗺️ OpenStreetMap</b> <span class="muted">홀 정보가 있으면 그린 위치까지 채움</span></p>
        <div class="list">${r.slice(0, 20).map((x, i) => `<button data-act="osmPick" data-id="${i}">⛳ ${esc(x.name)}</button>`).join('')}</div>` : '';
  out.innerHTML = dbHtml + osmHtml + (db.length || (r && r.length) ? ''
    : `<p>「${esc(q)}」 골프장을 찾지 못했습니다. 이름을 짧게 (예: 「레이크사이드」) 다시 검색하거나 직접 만드세요.</p>`)
    + '<div class="list"><button data-act="newCourse">＋ 새 코스 직접 만들기</button></div>';
}
// 내장 데이터 코스의 파를 고치면 store.dbFix에 기억 → 같은 골프장으로 코스를 다시 만들 때도 수정값 사용
function dbPars(c, n) {
  const fix = canEdit() && store.dbFix && store.dbFix[c.name] && store.dbFix[c.name][n.label];
  return fix && fix.length === 9 ? fix : n.pars;
}
function setPar(cid, i, p) {
  const c = store.courses[cid];
  c.holes[i].par = p;
  if (!c.src || !c.src.startsWith('db:') || !c.nines) return;
  const name = c.src.slice(3), half = i < 9 ? 0 : 1, label = c.nines[half];
  const base = PAR_DB.find(x => x.name === name);
  const orig = base && base.nines.find(n => n.label === label);
  const pars = c.holes.slice(half * 9, half * 9 + 9).map(h => h.par);
  store.dbFix = store.dbFix || {};
  store.dbFix[name] = store.dbFix[name] || {};
  if (orig && pars.join() === orig.pars.join()) delete store.dbFix[name][label];
  else store.dbFix[name][label] = pars;
  if (!Object.keys(store.dbFix[name]).length) delete store.dbFix[name];
}
function dbPick(i) {
  const c = PAR_DB[i]; if (!c) return;
  osmState.dbPicked = c;
  const opt = sel => c.nines.map((n, k) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${esc(n.label)}</option>`).join('');
  const sum = p => p.reduce((s, v) => s + v, 0);
  const fixed = canEdit() && !!(store.dbFix && store.dbFix[c.name]);
  openSheet(`<h3>${esc(c.name)}</h3>
    <table class="card"><tr><th>코스</th><th>홀별 파</th><th>합</th></tr>
    ${c.nines.map(n => { const p = dbPars(c, n), mine = p !== n.pars;
      return `<tr><td>${esc(n.label)}${mine ? ' ✏️' : ''}</td><td>${p.join(' ')}</td><td>${sum(p)}</td></tr>`; }).join('')}</table>
    ${fixed ? `<p class="muted">✏️ 표시는 직접 수정한 값입니다. <button data-act="dbReset" data-id="${i}" style="padding:4px 8px">원래 값으로 되돌리기</button></p>` : ''}
    ${c.verified ? '' : `<p style="color:var(--warn)">⚠️ 확인 필요: ${esc(c.notes || '출처 간 대조가 끝나지 않았습니다')} — 현장 스코어카드와 비교하세요.</p>`}
    <div class="row"><span style="flex:0 0 auto">전반</span><select id="dbFront">${opt(0)}</select>
      <span style="flex:0 0 auto">후반</span><select id="dbBack">${opt(c.nines.length > 1 ? 1 : 0)}</select></div>
    <p class="muted">출처: ${esc(c.source || '-')} (${esc(c.checked || '')} 조회). 그린 위치는 라운드 중 지도에서 탭해 등록합니다.</p>
    <div class="list"><button data-act="dbCreate" class="primary">코스 만들기</button>${window.GolfAuth ? GolfAuth.editButton(c.name) : ''}<button data-act="osmSearch">← 다시 검색</button></div>`);
}
function dbCreate() {
  const c = osmState.dbPicked;
  const f = c.nines[+document.getElementById('dbFront').value], b = c.nines[+document.getElementById('dbBack').value];
  const plain = c.nines.length === 2 && f !== b && /\bOUT\b/i.test(f.label) && /\bIN\b/i.test(b.label);

const locState = { results: [] };
async function locSearch(id) {
  const q = document.getElementById('locQ').value.trim(), out = document.getElementById('locOut');
  if (!q) return;
  const m = q.match(/(-?\d{1,2}\.\d+)\s*[, ]\s*(-?\d{1,3}\.\d+)/);
  if (m) { setCourseCenter(id, [+m[1], +m[2]]); return; }
  out.innerHTML = '<p>검색 중…</p>';
  locState.results = null;
  try {
    const res = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&accept-language=ko,en&q=' + encodeURIComponent(q));
    if (res.ok) locState.results = await res.json();
  } catch (e) { /* Nominatim 캐시 응답에 CORS 헤더가 빠지는 경우 → Photon으로 재시도 */ }
  if (!locState.results || !locState.results.length) {
    try {
      const res = await fetch('https://photon.komoot.io/api/?limit=8&q=' + encodeURIComponent(q));
      if (res.ok) {
        const fc = await res.json();
        locState.results = fc.features.map(f => ({ lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0],
          display_name: [f.properties.name, f.properties.city, f.properties.state, f.properties.country].filter(Boolean).join(', ') }));
      }
    } catch (e) { /* 둘 다 실패 → 좌표 직접 입력 안내 */ }
  }
  if (!document.getElementById('locOut')) return;
  out.innerHTML = locState.results === null ? '<p>검색 서버가 응답하지 않습니다. 좌표를 직접 붙여넣어 보세요.</p>'
    : locState.results.length ? `<div class="list">${locState.results.map((r, i) =>
        `<button data-act="locPick" data-id="${id}" data-k="${i}">📍 ${esc(r.display_name)}</button>`).join('')}</div>`
    : '<p>찾지 못했습니다. 영문 이름이나 도시명으로 다시 검색하거나, 구글지도에서 좌표를 복사해 붙여넣으세요.</p>';
}

// 같은 골프장·같은 전후반으로 만든 코스가 있으면 재사용(등록한 그린 유지), 없으면 새로 만들고
// 같은 골프장의 다른 조합 코스에 등록해 둔 9홀 그린·티 위치를 이어받음
function findOrMakeDbCourse(c, f, b) {
  const src = 'db:' + c.name, same = Object.keys(store.courses).filter(id => store.courses[id].src === src);
  const hit = same.find(id => (store.courses[id].nines || []).join('|') === f.label + '|' + b.label);
  if (hit) return hit;
  const plain = c.nines.length === 2 && f !== b && /\bOUT\b/i.test(f.label) && /\bIN\b/i.test(b.label);
  const holes = [...dbPars(c, f), ...dbPars(c, b)].map(p => ({ par: p, green: null, tee: null }));
  [f.label, b.label].forEach((label, half) => same.forEach(id => {
    const o = store.courses[id], k = (o.nines || []).indexOf(label); if (k < 0) return;
    for (let j = 0; j < 9; j++) {
      const from = o.holes[k * 9 + j], to = holes[half * 9 + j];
      if (!to.green && from.green) to.green = JSON.parse(JSON.stringify(from.green));
      if (!to.tee && from.tee) to.tee = from.tee.slice();
    }
  }));
  const id = 'c' + Date.now();
  store.courses[id] = { name: plain ? c.name : `${c.name} ${f.label}→${b.label}`, src, nines: [f.label, b.label], holes };
  save();
  return id;
}
// ---------- 출발 코스 고르기 — 골프장마다 그날 OUT/IN(또는 동·서·남…) 어느 코스에서 출발할지 다름 ----------
// 18홀: 「A 출발」「B 출발」 한 번 누르면 시작 / 27·36홀: 전반·후반 코스 버튼 → 시작

    if (url && el.isConnected) el.innerHTML = `<img src="${url}" alt="${i + 1}번홀 샷 사진" style="display:block;width:100%;border-radius:10px">`;
  }
}
async function saveHoleImg(rd, c, i) {   // 사진 저장·공유 (카톡 등)
  const url = await holeImageURL(rd.holes[i], c.holes[i], { i, course: c.name, date: rd.date });
  if (!url) { toast('위성 사진을 만들 수 없습니다 (인터넷 연결·샷 기록 확인)', 3000); return; }
  const name = `${c.name}_${i + 1}번홀.jpg`.replace(/[\\/:*?"<>|\s]+/g, '_');
  try {
    const blob = await (await fetch(url)).blob(), file = new File([blob], name, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: `${i + 1}번홀` }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  toast('사진을 저장했습니다', 2000);
}
function longest(shots) {
  let m = 0;
  for (let i = 1; i < shots.length; i++) m = Math.max(m, haversine(shots[i - 1].p, shots[i].p));
  return m ? fmt(m) : '';
}
// 라운드 끝내기: 실수로 시작했거나 중간에 그만둔 라운드도 바로 정리 (저장 / 기록 버리기)
const playedHoles = rd => rd.holes.filter(h => h.strokes || h.putts || h.shots.length).length;
function endRoundSheet() {
  const rd = round(); if (!rd) return;
  const n = playedHoles(rd), tot = rd.holes.reduce((s, x) => s + x.strokes, 0);
  openSheet(`<h3>🏁 라운드 끝내기</h3>
    <p>${esc(course() ? course().name : '')} · ${new Date(rd.date).toLocaleDateString('ko-KR')}<br>
      <span class="muted">${n ? `${n}홀 기록 · ${tot}타${n < 18 ? ' (중간에 그만둔 라운드)' : ''}` : '기록이 하나도 없는 라운드입니다'}</span></p>
    <div class="list">
      ${n ? `<button data-act="finishSave" class="primary">💾 기록 저장하고 끝내기 <span class="muted" style="color:#cfe">· 「지난 라운드」에 남김</span></button>
             <button data-act="finishDrop">🗑️ 기록 버리고 끝내기 <span class="muted">· 저장 안 함</span></button>`
          : `<button data-act="finishDrop" class="primary">✖ 라운드 끝내기 <span class="muted" style="color:#cfe">· 저장할 기록 없음</span></button>`}
      <button data-act="close">↩ 계속 라운드하기</button></div>`);
}
function endRoundDone(msg) {
  store.round = null; save(); closeSheet(); render(); layers.clearLayers(); toast(msg, 2200);
  setTimeout(() => { if (!round() && !sheet.classList.contains('show')) openHome(); }, 600);
}
function finishRound() {
  const rd = round(); if (!rd) return;
  store.history.unshift({ ...rd, courseSnapshot: JSON.parse(JSON.stringify(course())) });
  endRoundDone('라운드가 「지난 라운드」에 저장되었습니다');
}
function discardRound() {
  const rd = round(); if (!rd) return;
  if (roundPlayed(rd) && !confirm(`${playedHoles(rd)}홀 기록을 저장하지 않고 버릴까요?
버린 기록은 되살릴 수 없습니다.`)) return;
  endRoundDone(roundPlayed(rd) ? '기록을 버리고 라운드를 끝냈습니다' : '라운드를 끝냈습니다');
}
// 내기 게임(오장·업다운)은 그날 정산용 → 라운드 기록(스코어·샷 궤적)과 따로 지움
const hasBet = h => !!(h.game || h.updown);
function dropBet(h) { delete h.game; delete h.updown; }
function showHistory() {
  openSheet(`<h3>지난 라운드</h3><div class="list">
    ${store.history.map((h, i) => {
      const tot = h.holes.reduce((s, x) => s + x.strokes, 0), pt = h.holes.reduce((s, x) => s + x.putts, 0), n = playedHoles(h);
      return `<button data-act="histCard" data-id="${i}">${new Date(h.date).toLocaleDateString('ko-KR')} · ${esc(h.courseSnapshot.name)} · ${tot}타 / ${pt}퍼트${n < 18 ? ` <span class="muted">· ${n}홀</span>` : ''}${h.game ? ' 🎲' : ''}${h.updown ? ' 🤝' : ''}</button>`;
    }).join('') || '<p class="muted">저장된 라운드가 없습니다.</p>'}
    ${store.history.some(hasBet) ? '<button data-act="betDelAll">🎲 내기 게임 기록 모두 지우기 <span class="muted">· 스코어·샷 기록은 그대로</span></button>' : ''}
    <button data-act="close">닫기</button></div>
    <p class="muted">🎲 오장게임 · 🤝 팀 업다운 기록이 있는 라운드. 내기 기록은 그날 정산용이라 따로 지울 수 있고, 스코어·샷 궤적은 라운드를 삭제하기 전까지 남습니다.</p>`);
}
function showBackup() {
  openSheet(`<h3>데이터 백업/복원</h3>
    <p class="muted">코스(그린 좌표)와 라운드 기록은 이 휴대폰 브라우저에만 저장됩니다. 폰 교체·브라우저 데이터 삭제 전에 백업 파일을 받아두세요.</p>
    <div class="list"><button data-act="export">⬇️ 백업 파일 저장(.json)</button><button data-act="import">⬆️ 백업 파일 불러오기</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none"><button data-act="close">닫기</button></div>`);
}
function exportData() {
  const blob = new Blob([JSON.stringify(store, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `golf-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importData(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      if (!d.courses) throw new Error('형식 오류');
      if (!confirm('현재 데이터를 백업 파일 내용으로 바꿀까요?')) return;
      Object.keys(store).forEach(k => delete store[k]);
      Object.assign(store, d);
      if (!canEdit()) {   // 회원: 서버 DB 골프장만 남기고 파는 서버 값으로
        Object.keys(store.courses).forEach(id => { const s = store.courses[id].src; if (!s || !s.startsWith('db:')) delete store.courses[id]; });
        if (store.round && !store.courses[store.round.courseId]) store.round = null;
        enforceMemberPars();
      }
      save(); closeSheet(); render(); fitHole(); toast('복원 완료');
    } catch (e) { toast('불러오기 실패: 올바른 백업 파일이 아닙니다'); }
  };
  fr.readAsText(file);
}

// ---------- 유틸 ----------
function esc(s) { return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
let toastTimer;
function toast(msg, ms = 1800) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = 'none'; }, ms);
}

// 라운드 중 화면 꺼짐 방지
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* 미지원 기기 */ }
}
document.addEventListener('visibilitychange', keepAwake);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

repairRound(); startGps(); keepAwake(); render(); fitHole();
// 앱을 열거나(새로 실행) 백그라운드에서 다시 돌아왔을 때: 쉬고 있는 라운드(3시간 기록 없음·날짜 바뀜)는
// 뒤에 남겨 두지 않고 정리 — 기록 있으면 「지난 라운드」에 저장, 시작만 하고 1시간 지난 빈 라운드는 버림 → 깨끗한 첫 화면
function tidyStaleRound(onOpen) {
  const rd = round();
  if (rd && roundIsStale() && (roundPlayed(rd) || Date.now() - Date.parse(rd.date) > 3600000)) {
    if (sheet.classList.contains('show')) closeSheet();
    archiveStaleRound(); render();
  }
  if ((onOpen || !round() || roundIsStale()) && !sheet.classList.contains('show')) openHome();
}
setTimeout(() => tidyStaleRound(true), 400);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') tidyStaleRound(false); });
</script>
