<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>골프 거리측정</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="골프거리">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #0b1a12; --panel: #12291c; --line: #24442f; --text: #eef5f0; --muted: #9db8a6;
    --accent: #7ee08a; --warn: #ffcc4d; --bad: #ff6b6b; --btn: #1d3d2a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  body { display: flex; flex-direction: column; overscroll-behavior: none; }
  button { font: inherit; color: var(--text); background: var(--btn); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  button:active { transform: scale(.97); }
  button.primary { background: #2f7d45; border-color: #3f9a58; font-weight: 700; }
  button.on { background: var(--accent); color: #062010; font-weight: 700; }
  select, input[type=text] { font: inherit; background: var(--btn); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px; }

  header { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 6px) 10px 6px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  header .hole { flex: 1; min-width: 0; text-align: center; cursor: pointer; }
  header .hole b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .hole b { font-size: 20px; }
  header .hole small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button { padding: 8px 10px; font-size: 16px; flex: 0 0 auto; }
  html, body { overflow-x: hidden; }
  .gps { font-size: 11px; padding: 3px 6px; border-radius: 6px; background: #333; white-space: nowrap; }
  .gps.good { background: #1f6b35; } .gps.mid { background: #7a6312; } .gps.bad { background: #7a1f1f; }

  #map { flex: 1; min-height: 34vh; background: #000; }
  .banner { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 800;
    background: rgba(0,0,0,.78); padding: 8px 12px; border-radius: 10px; font-size: 14px; text-align: center; max-width: 92vw; }
  .banner .chips { margin-top: 6px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .banner .chips button { padding: 6px 10px; font-size: 13px; }
  .mapwrap { position: relative; flex: 1; display: flex; flex-direction: column; }
  .fab { position: absolute; right: 10px; z-index: 800; padding: 8px 10px; font-size: 13px; background: rgba(18,41,28,.9); }

  #panel { background: var(--panel); border-top: 1px solid var(--line); padding: 8px 10px calc(env(safe-area-inset-bottom) + 8px); }
  .dist { display: flex; align-items: stretch; gap: 8px; }
  .big { flex: 1.3; text-align: center; background: #0d2016; border-radius: 12px; padding: 4px 0; }
  .big .lbl { font-size: 12px; color: var(--muted); }
  .big .num { font-size: 52px; font-weight: 800; line-height: 1.05; color: var(--accent); font-variant-numeric: tabular-nums; }
  .fcb { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
  .fcb div { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 8px;
    background: #0d2016; border-radius: 8px; font-variant-numeric: tabular-nums; }
  .fcb span { color: var(--muted); font-size: 13px; } .fcb b { font-size: 20px; }
  .pinrow { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .pinrow button { padding: 6px 10px; font-size: 13px; }
  .pinrow input[type=range] { flex: 1; accent-color: var(--accent); }
  .live { display: flex; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--muted); }
  .live div { flex: 1; background: #0d2016; border-radius: 8px; padding: 4px 8px; }
  .live b { color: var(--text); font-size: 16px; font-variant-numeric: tabular-nums; }
  .lastshot { margin-top: 6px; background: #0d2016; border-radius: 8px; padding: 6px 10px; font-size: 15px; display: none; }
  .lastshot b { color: var(--accent); font-size: 20px; font-variant-numeric: tabular-nums; }
  .counter.hl { outline: 2px solid var(--accent); animation: pulse 1s ease-in-out 3; }
  @keyframes pulse { 50% { outline-color: transparent; } }
  .big.nogreen { cursor: pointer; }
  .big.nogreen .num { font-size: 22px; padding: 12px 0; color: var(--warn); }
  .shots { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 16px; white-space: nowrap; overflow-x: auto; }
  .actions { display: flex; gap: 6px; margin-top: 6px; }
  .actions button { flex: 1; padding: 11px 4px; font-size: 14px; }
  .score { display: flex; gap: 8px; margin-top: 6px; }
  .counter { flex: 1; display: flex; align-items: center; justify-content: space-between; background: #0d2016;
    border-radius: 10px; padding: 3px; }
  .counter span { font-size: 13px; color: var(--muted); padding-left: 6px; }
  .counter b { font-size: 22px; min-width: 28px; text-align: center; }
  .counter button { padding: 6px 14px; font-size: 18px; }

  .sheet { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,.6); display: none; }
  .sheet.show { display: flex; align-items: flex-end; }
  .sheet .box { background: var(--panel); width: 100%; max-height: 88vh; overflow: auto; border-radius: 16px 16px 0 0;
    padding: 14px 14px calc(env(safe-area-inset-bottom) + 14px); }
  .sheet h3 { margin: 4px 0 10px; }
  .sheet .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  .sheet .row > * { flex: 1; }
  .list button { display: block; width: 100%; text-align: left; margin: 6px 0; }
  table.card { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  table.card th, table.card td { border: 1px solid var(--line); padding: 5px 3px; text-align: center; }
  table.card th { background: #0d2016; color: var(--muted); font-weight: 500; }
  table.card tr.sum td { font-weight: 700; background: #0d2016; }
  .under { color: #6cc4ff; } .over { color: #ff9d7a; }
  .holegrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .holegrid div { background: #0d2016; border-radius: 8px; padding: 6px; font-size: 13px; }
  .muted { color: var(--muted); font-size: 12px; }
  .toast { position: fixed; left: 50%; bottom: 40%; transform: translateX(-50%); z-index: 3000; background: rgba(0,0,0,.85);
    padding: 10px 16px; border-radius: 10px; display: none; font-size: 15px; }

  .leaflet-container { background: #111; }
  .lbl-tip { background: rgba(0,0,0,.75); color: #fff; border: 0; font-weight: 700; font-size: 13px; }
  .lbl-tip::before { display: none; }
  .shot-tip { font-size: 12px; padding: 2px 6px; }
  #reviewBar { position: fixed; left: 8px; right: 8px; top: 64px; z-index: 1500; display: none; background: rgba(15,30,22,.93);
    border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 14px; }
  #reviewBar button { flex: 1 1 auto; padding: 6px 8px; font-size: 13px; }
</style>
</head>
<body>

<header>
  <button id="prevHole" aria-label="이전 홀">◀</button>
  <div class="hole" id="holeTitle"><b>골프 거리측정</b><small>코스를 선택하세요</small></div>
  <button id="nextHole" aria-label="다음 홀">▶</button>
  <span class="gps" id="gpsBadge">GPS …</span>
  <button id="menuBtn" aria-label="메뉴">☰</button>
</header>

<div class="mapwrap">
  <div id="map"></div>
  <div class="banner" id="banner" style="display:none"></div>
  <button class="fab" id="centerBtn" style="top:10px">◎ 내 위치</button>
  <button class="fab" id="fitBtn" style="top:50px">⛳ 홀 보기</button>
</div>

<div id="panel">
  <div class="dist">
    <div class="big"><div class="lbl" id="pinLbl">핀까지</div><div class="num" id="dPin">—</div></div>
    <div class="fcb">
      <div><span>앞</span><b id="dF">—</b></div>
      <div><span>중</span><b id="dC">—</b></div>
      <div><span>뒤</span><b id="dB">—</b></div>
    </div>
  </div>
  <div class="pinrow">
    <span class="muted">핀</span>
    <button data-pin="0">앞</button>
    <button data-pin="50">중</button>
    <button data-pin="100">뒤</button>
    <input type="range" id="pinSlider" min="0" max="100" step="5" value="50" aria-label="핀 위치 미세조정">
  </div>
  <div class="live">
    <div>홀 전장 (티→핀)<br><b id="dHole">—</b></div>
    <div>이번 샷 비거리 (직전 지점→나)<br><b id="dLast">—</b></div>
  </div>
  <div class="lastshot" id="lastShot"></div>
  <div class="shots" id="shotList"></div>
  <div class="actions">
    <button id="teeBtn">⛳ 티샷 위치</button>
    <button id="shotBtn" class="primary">● 샷 위치 기록</button>
    <button id="undoBtn">↶ 취소</button>
  </div>
  <div class="score">
    <div class="counter"><span id="strokesLbl">타수</span><button data-c="strokes" data-d="-1">−</button><b id="strokes">0</b><button data-c="strokes" data-d="1">＋</button></div>
    <div class="counter" id="puttBox"><span>퍼트</span><button data-c="putts" data-d="-1">−</button><b id="putts">0</b><button data-c="putts" data-d="1">＋</button></div>
  </div>
</div>

<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="osm.js?v=21"></script>
<script>
'use strict';

// ---------- 저장소 ----------
const KEY = 'golfRangefinder.v1';
const APP_VER = 'v21';   // sw.js CACHE 버전과 함께 올림 — 메뉴 하단에 표시(휴대폰에 새 버전이 받아졌는지 확인용)
const store = load();
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.courses) return s;
  } catch (e) { /* 손상된 데이터는 새로 시작 */ }
  return { courses: {}, round: null, history: [], unit: 'm' };
}
// 라운드 내용이 실제로 바뀐 저장만 「마지막 기록 시각」으로 남김 (로그인·설정 저장으로 갱신되지 않게)
let lastRoundJson = store.round ? JSON.stringify({ ...store.round, touched: 0 }) : null;
function save() {
  if (store.round) {
    const j = JSON.stringify({ ...store.round, touched: 0 });
    if (j !== lastRoundJson) { store.round.touched = Date.now(); lastRoundJson = j; }
  } else lastRoundJson = null;
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { toast('저장 실패: 저장공간 확인'); }
}

// ---------- 거리 계산 ----------
function haversine(a, b) {
  const R = 6371008.8, rad = Math.PI / 180;
  const dLat = (b[0] - a[0]) * rad, dLng = (b[1] - a[1]) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmt(m) {
  if (m == null || !isFinite(m)) return '—';
  return store.unit === 'yd' ? Math.round(m * 1.09361) : Math.round(m);
}
function unitLbl() { return store.unit === 'yd' ? 'yd' : 'm'; }
function lerp(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }

// ---------- 상태 접근 ----------
const round = () => store.round;
const course = () => round() && store.courses[round().courseId];
const holeIdx = () => round() ? round().hole : 0;
const holeDef = () => course() && course().holes[holeIdx()];
const holeRec = () => round() && round().holes[holeIdx()];

function pinPoint() {
  return holeDef() ? pinOf(holeDef().green, holeRec().pin) : null;
}

// ---------- 지도 ----------
const map = L.map('map', { zoomControl: false, attributionControl: true }).setView([37.5, 127.0], 16);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 21, maxNativeZoom: 19, attribution: 'Esri World Imagery'
}).addTo(map);
const layers = L.layerGroup().addTo(map);
const meMarker = L.circleMarker([0, 0], { radius: 8, color: '#fff', weight: 3, fillColor: '#2b8cff', fillOpacity: 1 });
const meAcc = L.circle([0, 0], { radius: 1, color: '#2b8cff', weight: 1, fillOpacity: .12 });
let measure = null; // 지도 탭 측정 지점

// ---------- GPS ----------
let me = null, meAccM = null, firstFix = true;
const samples = [];
// 정확도 가중 평균 (가중치 1/acc²) + 중앙값에서 멀리 튄 값 제거
function fusePoints(pts) {
  if (!pts.length) return null;
  const med = [pts.map(s => s.p[0]).sort((a, b) => a - b)[pts.length >> 1], pts.map(s => s.p[1]).sort((a, b) => a - b)[pts.length >> 1]];
  const best = Math.min(...pts.map(s => s.acc));
  const keep = pts.length >= 3 ? pts.filter(s => haversine(s.p, med) <= Math.max(best * 1.5, 3)) : pts;
  const use = keep.length ? keep : pts;
  let w = 0, lat = 0, lng = 0;
  for (const s of use) { const k = 1 / Math.max(s.acc, 1) ** 2; w += k; lat += s.p[0] * k; lng += s.p[1] * k; }
  // n개 독립 측정 평균 → 오차가 대략 1/√n로 줄어듦 (단, GPS 오차는 시간상 상관이 있어 하한을 둠)
  const acc = Math.max(best / Math.sqrt(use.length), best * 0.6);
  return { p: [lat / w, lng / w], acc, n: use.length, best };
}
function startGps() {
  if (!('geolocation' in navigator)) { setBadge('GPS 없음', 'bad'); return; }
  navigator.geolocation.watchPosition(pos => {
    const raw = [pos.coords.latitude, pos.coords.longitude];
    meAccM = pos.coords.accuracy;
    if (meAccM <= 60) samples.push({ p: raw, acc: meAccM, t: Date.now() });
    while (samples.length && Date.now() - samples[0].t > 10000) samples.shift();
    // 실시간 위치: 최근 4초 측정 중 현재 위치와 일치하는(정지 상태) 것만 평균 → 숫자 흔들림 감소, 걷는 중엔 최신값
    const recent = samples.filter(s => Date.now() - s.t <= 4000 && haversine(s.p, raw) <= Math.max(meAccM, 3));
    const f = recent.length >= 2 ? fusePoints(recent) : null;
    me = f ? f.p : raw;
    setBadge('±' + Math.round(meAccM) + 'm', meAccM <= 6 ? 'good' : meAccM <= 15 ? 'mid' : 'bad');
    meMarker.setLatLng(me).addTo(map);
    meAcc.setLatLng(me).setRadius(meAccM).addTo(map);
    if (firstFix) { firstFix = false; fitHole(); }
    render();
  }, err => {
    setBadge(err.code === 1 ? '위치권한 거부' : 'GPS 오류', 'bad');
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
}
function setBadge(t, cls) { const b = document.getElementById('gpsBadge'); b.textContent = t; b.className = 'gps ' + cls; }

// 샷 위치 확정: 3~8초 측정(측정 5회 이상·정확도 5m 이내면 3초에 종료) → 튄 값 제거 후 가중 평균
let measuring = false;
function stablePosition() {
  return new Promise(resolve => {
    if (!me || measuring) { resolve(null); return; }
    measuring = true;
    const t0 = Date.now();
    const tick = () => {
      const el = Date.now() - t0;
      const pts = samples.filter(s => s.t >= t0 - 1000);
      const f = fusePoints(pts);
      const done = el >= 8000 || (el >= 3000 && pts.length >= 5 && f && f.best <= 5);
      if (!done) {
        toast(`📡 위치 측정 중… 움직이지 마세요 (${pts.length}회${f ? ` · ±${Math.round(f.acc)}m` : ''})`, 1200);
        setTimeout(tick, 500); return;
      }
      measuring = false;
      if (!f) { resolve({ p: me, acc: meAccM, n: 1 }); return; }
      if (f.acc > 10 && !confirm(`GPS 정확도가 낮습니다 (±${Math.round(f.acc)}m).\n하늘이 트인 곳에서 다시 측정하면 더 정확합니다.\n\n그래도 이 위치로 기록할까요?`)) { resolve(null); return; }
      resolve(f);
    };
    tick();
  });
}

// ---------- 화면 갱신 ----------
function render() {
  const $ = id => document.getElementById(id);
  const c = course(), h = holeDef(), r = holeRec();
  if (!c) {
    $('holeTitle').innerHTML = '<b>골프 거리측정</b><small>☰ 메뉴에서 코스를 선택하세요</small>';
    ['dPin', 'dF', 'dC', 'dB', 'dHole', 'dLast'].forEach(id => { $(id).textContent = '—'; });
    $('strokes').textContent = 0; $('putts').textContent = 0; $('shotList').textContent = '';
    $('lastShot').style.display = 'none';
    return;
  }
  $('holeTitle').innerHTML = `<b>${holeIdx() + 1}번홀 · Par ${h.par} <span style="font-size:13px;opacity:.6">✎</span></b><small>${esc(c.name)}</small>`;
  const g = h.green || {};
  const pin = pinPoint();
  $('dF').textContent = me && g.f ? fmt(haversine(me, g.f)) : '—';
  $('dC').textContent = me && g.c ? fmt(haversine(me, g.c)) : '—';
  $('dB').textContent = me && g.b ? fmt(haversine(me, g.b)) : '—';
  $('dPin').textContent = me && pin ? fmt(haversine(me, pin)) : (g.c ? '—' : '그린 위치 미등록 — 탭하여 등록');
  $('dPin').parentElement.classList.toggle('nogreen', !g.c);
  $('pinLbl').textContent = `핀까지 (${unitLbl()}) · ${pinName(r.pin)}`;
  document.querySelectorAll('[data-pin]').forEach(b => b.classList.toggle('on', +b.dataset.pin === r.pin));
  $('pinSlider').value = r.pin;

  const shots = r.shots;
  // 홀 전장: 기록한 티샷 지점(없으면 등록된 티, 그것도 없으면 현재 위치) → 핀
  const teeP = shots.length ? shots[0].p : h.tee;
  $('dHole').textContent = pin && teeP ? fmt(haversine(teeP, pin)) + unitLbl() : pin && me ? '티에서 「티샷 위치」' : '—';
  $('dLast').textContent = me && shots.length ? fmt(haversine(shots[shots.length - 1].p, me)) + unitLbl() : '—';
  const n = shots.length - 1;
  if (n >= 1) {
    const flown = haversine(shots[n - 1].p, shots[n].p), left = pin ? haversine(shots[n].p, pin) : null;
    const acc = Math.round(Math.hypot(shots[n - 1].acc || 0, shots[n].acc || 0));
    $('lastShot').innerHTML = `${n}샷 <b>${fmt(flown)}${unitLbl()}</b> 날아감${left != null ? ` · 핀까지 남은 <b>${fmt(left)}${unitLbl()}</b>` : ''}`
      + (acc ? ` <span class="muted">±${acc}m</span>` : '');
    $('lastShot').style.display = 'block';
  } else $('lastShot').style.display = 'none';
  $('shotList').textContent = shotSummary(shots, pin);
  $('strokes').textContent = r.strokes;
  $('strokesLbl').textContent = r.manual || shots.length < 2 ? '타수' : '타수(자동)';
  $('putts').textContent = r.putts;
  checkOnGreen(g, r);
  drawLayers();
}

// 온그린 판정: 그린 중앙에서 (그린 반경 + GPS 오차 여유) 이내 → 퍼트 입력 안내
function greenRadius(g) {
  const r = Math.max(g.f ? haversine(g.f, g.c) : 0, g.b ? haversine(g.b, g.c) : 0);
  return (r || 12) + 3;
}
let onGreenHole = null;
function checkOnGreen(g, r) {
  const key = round().date + ':' + holeIdx();
  const on = !!(me && g.c && haversine(me, g.c) <= greenRadius(g));
  document.getElementById('puttBox').classList.toggle('hl', on && !r.putts);
  if (on && onGreenHole !== key) {
    onGreenHole = key;
    toast(`⛳ 온그린 — ${r.shots.length >= 2 ? '그린 위 볼 위치를 「샷 위치 기록」 후 ' : ''}퍼트 수를 입력하세요`, 3500);
  }
}
// 타수 자동 계산: 기록한 샷 위치 수(티 제외) + 퍼트. 타수를 직접 누르면 수동 모드
function autoStrokes(r) {
  if (r.manual || r.shots.length < 2) return;
  r.strokes = (r.shots.length - 1) + r.putts;
}
function pinName(v) { return v === 0 ? '앞핀' : v === 50 ? '중핀' : v === 100 ? '뒤핀' : `핀 ${v}%`; }
function shotSummary(shots, pin) {
  if (!shots.length) return '티잉그라운드에서 「티샷 위치」를 누르세요';
  const parts = [];
  for (let i = 1; i < shots.length; i++) {
    const d = haversine(shots[i - 1].p, shots[i].p);
    const rem = pin ? ` (남은 ${fmt(haversine(shots[i].p, pin))})` : '';
    parts.push(`${i}샷 ${fmt(d)}${unitLbl()}${rem}`);
  }
  const total = haversine(shots[0].p, shots[shots.length - 1].p);
  return parts.length ? parts.join(' → ') + ` · 티~현재볼 ${fmt(total)}${unitLbl()}` : '티 위치 기록됨 — 볼에 도착하면 「샷 위치 기록」';
}

// 그린 점·핀·샷 궤적(샷마다 「n샷 거리 · 남은 거리」 표시) — 진행 중 라운드와 지난 라운드 다시보기가 같이 사용
function pinOf(g, pinPct) {
  if (!g || !g.c) return null;
  const f = g.f || g.c, b = g.b || g.c;
  return pinPct <= 50 ? lerp(f, g.c, pinPct / 50) : lerp(g.c, b, (pinPct - 50) / 50);
}
function drawHole(g, pin, shots) {
  g = g || {};
  const dot = (p, color, label) => L.circleMarker(p, { radius: 6, color: '#000', weight: 1, fillColor: color, fillOpacity: 1 })
    .bindTooltip(label, { permanent: true, direction: 'right', className: 'lbl-tip', offset: [6, 0] }).addTo(layers);
  if (g.f) dot(g.f, '#ffd84d', '앞');
  if (g.c) dot(g.c, '#ffffff', '중');
  if (g.b) dot(g.b, '#ff8a4d', '뒤');
  if (pin) L.marker(pin, { icon: L.divIcon({ html: '<div style="font-size:26px;transform:translate(-4px,-22px)">🚩</div>', className: '' }) }).addTo(layers);
  if (!shots.length) return;
  L.polyline(shots.map(s => s.p), { color: '#ffffff', weight: 3, dashArray: '6 6' }).addTo(layers);
  shots.forEach((s, i) => {
    const left = pin ? ` · 남은 ${fmt(haversine(s.p, pin))}${unitLbl()}` : '';
    const label = i ? `${i}샷 ${fmt(haversine(shots[i - 1].p, s.p))}${unitLbl()}${left}` : `티${pin ? ` · 핀까지 ${fmt(haversine(s.p, pin))}${unitLbl()}` : ''}`;
    L.circleMarker(s.p, { radius: 6, color: '#fff', weight: 2, fillColor: i ? '#e64' : '#3c3', fillOpacity: 1 })
      .bindTooltip(label, { permanent: true, direction: i % 2 ? 'left' : 'right', className: 'lbl-tip shot-tip', offset: [i % 2 ? -8 : 8, 0] }).addTo(layers);
  });
}
function fitTrack(pts) { if (pts.length > 1) map.fitBounds(pts, { padding: [70, 70], maxZoom: 19 }); else if (pts.length) map.setView(pts[0], 18); }

// 지난 라운드 홀 다시보기: 지도 위에 그 홀의 궤적을 그리고 위쪽에 요약 패널 표시
let review = null;   // { hi, i } — store.history 인덱스, 홀 인덱스
function showHoleTrack(hi, i) {
  const rd = store.history[hi], c = rd && rd.courseSnapshot; if (!c) return;
  const rec = rd.holes[i], g = c.holes[i].green || {}, pin = pinOf(g, rec.pin);
  review = { hi, i };
  closeSheet(); drawLayers();
  fitTrack([...rec.shots.map(s => s.p), ...(pin ? [pin] : [])]);
  const legs = rec.shots.slice(1).map((s, k) => `${k + 1}샷 <b>${fmt(haversine(rec.shots[k].p, s.p))}</b>`).join(' → ');
  const diff = rec.strokes ? rec.strokes - c.holes[i].par : null;
  let p = document.getElementById('reviewBar');
  if (!p) { p = document.createElement('div'); p.id = 'reviewBar'; document.body.appendChild(p); }
  p.innerHTML = `<b>${i + 1}번홀 · Par ${c.holes[i].par}</b> · ${rec.strokes || '-'}타${diff == null ? '' : ` (${diff > 0 ? '+' : ''}${diff})`} · ${rec.putts}퍼트
    <div style="margin:4px 0">${legs ? legs + ` <span class="muted">(${unitLbl()})</span>` : '<span class="muted">기록된 샷 위치가 없습니다</span>'}</div>
    <div class="row" style="margin:0"><button data-rv="prev">◀ 이전 홀</button><button data-rv="next">다음 홀 ▶</button><button data-rv="card">스코어카드</button><button data-rv="close">닫기</button></div>`;
  p.style.display = 'block';
}
function closeReview() {
  review = null;
  const p = document.getElementById('reviewBar'); if (p) p.style.display = 'none';
  drawLayers(); if (course()) fitHole();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-rv]'); if (!b || !review) return;
  const { hi, i } = review, a = b.dataset.rv;
  if (a === 'prev' || a === 'next') showHoleTrack(hi, (i + (a === 'next' ? 1 : 17)) % 18);
  else if (a === 'card') { closeReview(); showCard(store.history[hi], store.history[hi].courseSnapshot, hi); }
  else closeReview();
});

function drawLayers() {
  layers.clearLayers();
  if (review) {
    const rd = store.history[review.hi], rec = rd.holes[review.i], g = rd.courseSnapshot.holes[review.i].green;
    drawHole(g, pinOf(g, rec.pin), rec.shots); return;
  }
  const h = holeDef(); if (!h) return;
  const pin = pinPoint();
  const shots = holeRec().shots;
  drawHole(h.green, pin, shots);
  if (measure) {
    const ref = me || (shots.length ? shots[shots.length - 1].p : null);
    const lines = [];
    if (ref) { L.polyline([ref, measure], { color: '#7ee08a', weight: 3 }).addTo(layers); lines.push(`나→여기 ${fmt(haversine(ref, measure))}`); }
    if (pin) { L.polyline([measure, pin], { color: '#ffd84d', weight: 3 }).addTo(layers); lines.push(`여기→핀 ${fmt(haversine(measure, pin))}`); }
    L.circleMarker(measure, { radius: 7, color: '#000', weight: 2, fillColor: '#7ee08a', fillOpacity: 1 })
      .bindTooltip(lines.join('<br>') || '측정점', { permanent: true, direction: 'top', className: 'lbl-tip', offset: [0, -8] }).addTo(layers);
  }
}

function fitHole() {
  const h = holeDef();
  const pts = [];
  if (h && h.green) ['f', 'c', 'b'].forEach(k => h.green[k] && pts.push(h.green[k]));
  if (h && h.tee) pts.push(h.tee);
  const shots = holeRec() ? holeRec().shots : [];
  shots.forEach(s => pts.push(s.p));   // 지금까지 친 궤적 전체가 보이게
  const ctr = course() && course().center;
  if (!pts.length && ctr && (!me || haversine(me, ctr) > 3000)) { map.setView(ctr, 16); return; }
  if (me && (!pts.length || haversine(me, pts[0]) < 800)) pts.push(me);
  if (pts.length > 1) map.fitBounds(pts, { padding: [40, 40], maxZoom: 19 });
  else if (pts.length) map.setView(pts[0], 18);
}

// ---------- 그린 설정 모드 ----------
let setup = null; // 'f' | 'c' | 'b' | 'tee'
const SETUP_NAME = { f: '그린 앞', c: '그린 중앙', b: '그린 뒤', tee: '티잉그라운드' };
function enterSetup(key) {
  if (!course()) { toast('먼저 라운드를 시작하세요'); return; }
  setup = key || 'c';
  showBanner();
}
function showBanner() {
  const el = document.getElementById('banner');
  if (!setup) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = `<div>${holeIdx() + 1}번홀 <b>${SETUP_NAME[setup]}</b> — 위성지도에서 위치를 탭하세요</div>
    <div class="chips">
      ${['f', 'c', 'b', 'tee'].map(k => `<button data-setup="${k}" class="${k === setup ? 'on' : ''}">${SETUP_NAME[k]}</button>`).join('')}
      <button data-setup="here">현재 위치로</button>
      <button data-setup="done" class="primary">완료</button>
    </div>`;
}
function setPoint(key, p) {
  const h = holeDef();
  if (key === 'tee') h.tee = p;
  else { h.green = h.green || {}; h.green[key] = p; }
  save();
  const order = ['c', 'f', 'b'];
  const next = order.find(k => !(h.green && h.green[k]));
  if (key !== 'tee' && next) setup = next;
  showBanner(); render();
}
document.getElementById('banner').addEventListener('click', e => {
  const k = e.target.dataset && e.target.dataset.setup; if (!k) return;
  if (k === 'done') { setup = null; showBanner(); fitHole(); return; }
  if (k === 'here') { if (me) setPoint(setup, me.slice()); else toast('GPS 신호 대기 중'); return; }
  setup = k; showBanner();
});
map.on('click', e => {
  const p = [e.latlng.lat, e.latlng.lng];
  if (setup) { setPoint(setup, p); return; }
  if (!course()) return;
  measure = measure && haversine(measure, p) < 3 ? null : p;
  drawLayers();
});

// ---------- 샷 기록 ----------
document.getElementById('teeBtn').addEventListener('click', async () => {
  if (!course()) { openMenu(); return; }
  const r = holeRec();
  if (r.shots.length && !confirm('이 홀의 샷 기록을 지우고 티 위치를 다시 잡을까요?')) return;
  if (!me) { toast('GPS 신호 대기 중'); return; }
  const s = await stablePosition();
  if (!s) return;
  r.shots = [{ p: s.p, acc: s.acc, t: Date.now() }];
  if (!holeDef().tee) holeDef().tee = s.p;
  autoStrokes(r); save(); render();
  const pin = pinPoint();
  toast(`티 위치 기록 (±${Math.round(s.acc)}m)` + (pin ? ` · 핀까지 ${fmt(haversine(s.p, pin))}${unitLbl()}` : ''), 3000);
});
document.getElementById('shotBtn').addEventListener('click', async () => {
  if (!course()) { openMenu(); return; }
  const r = holeRec();
  if (!r.shots.length) {
    if (!holeDef().tee || !confirm('티샷 위치가 기록되지 않았습니다.\n등록된 티잉그라운드 위치에서 친 것으로 보고 거리를 계산할까요?')) {
      toast('티잉그라운드에서 먼저 「티샷 위치」를 누르세요', 2500); return;
    }
    r.shots = [{ p: holeDef().tee, acc: 0, t: Date.now(), reg: true }];
  }
  if (!me) { toast('GPS 신호 대기 중'); return; }
  const s = await stablePosition();
  if (!s) return;
  const prev = r.shots[r.shots.length - 1].p;
  r.shots.push({ p: s.p, acc: s.acc, t: Date.now() });
  autoStrokes(r); save(); render();
  const pin = pinPoint(), g = holeDef().green;
  toast(`${r.shots.length - 1}샷 ${fmt(haversine(prev, s.p))}${unitLbl()} 날아감` + (pin ? ` · 핀까지 남은 ${fmt(haversine(s.p, pin))}${unitLbl()}` : ''), 3500);
  // 온그린 지점을 기록하면 티부터 그린까지 날아온 궤적 전체를 지도에 맞춰 보여 줌
  if (g && g.c && haversine(s.p, g.c) <= greenRadius(g)) fitTrack([...r.shots.map(x => x.p), ...(pin ? [pin] : [])]);
});
document.getElementById('undoBtn').addEventListener('click', () => {
  const r = holeRec(); if (!r || !r.shots.length) return;
  if (!confirm('마지막 샷 위치 기록을 취소할까요?')) return;
  r.shots.pop(); autoStrokes(r); save(); render();
});
document.getElementById('dPin').parentElement.addEventListener('click', () => {
  const h = holeDef(); if (h && !(h.green && h.green.c)) enterSetup('c');
});

// ---------- 핀 위치 ----------
function setPin(v) { const r = holeRec(); if (!r) return; r.pin = v; save(); render(); }
document.querySelectorAll('[data-pin]').forEach(b => b.addEventListener('click', () => setPin(+b.dataset.pin)));
document.getElementById('pinSlider').addEventListener('input', e => setPin(+e.target.value));

// ---------- 타수/퍼트 ----------
document.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => {
  const r = holeRec(); if (!r) return;
  const k = b.dataset.c;
  r[k] = Math.max(0, r[k] + (+b.dataset.d));
  if (k === 'strokes') r.manual = true;          // 타수를 직접 바꾸면 자동 계산 중지 (OB·벌타 등)
  else autoStrokes(r);
  if (k === 'putts' && r.putts > r.strokes) r.strokes = r.putts;
  save(); render();
}));

// ---------- 홀 이동 ----------
function goHole(d) {
  const rd = round(); if (!rd) return;
  rd.hole = (rd.hole + d + 18) % 18; measure = null;
  save(); render(); fitHole(); showBanner();
  if (!(holeDef().green && holeDef().green.c)) toast('이 홀의 그린 위치가 없습니다. ☰ → 그린 위치 설정', 2500);
}
document.getElementById('prevHole').addEventListener('click', () => goHole(-1));
document.getElementById('nextHole').addEventListener('click', () => goHole(1));
document.getElementById('centerBtn').addEventListener('click', () => { if (me) map.setView(me, Math.max(map.getZoom(), 17)); });
document.getElementById('fitBtn').addEventListener('click', fitHole);

// ---------- 시트(메뉴/코스/스코어카드) ----------
const sheet = document.getElementById('sheet'), box = document.getElementById('sheetBox');
function openSheet(html) { box.innerHTML = html; sheet.classList.add('show'); }
function closeSheet() { sheet.classList.remove('show'); }
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

// ── 앱 설치 (Android: 설치 프롬프트, iPhone: 안내) ──
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
window.addEventListener('appinstalled', () => { installPrompt = null; });
function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}
async function showInstall() {
  if (installPrompt) {
    closeSheet();
    installPrompt.prompt();
    await installPrompt.userChoice.catch(() => {});
    installPrompt = null;
    return;
  }

  openSheet(`<h3>📲 앱으로 설치</h3>

      <p class="muted">Chrome 등 다른 브라우저에서 열었다면 Safari로 다시 여세요.</p>`
    : `<p><b>Android (Chrome)</b></p>
      <p>1. 오른쪽 위 <b>⋮ 메뉴</b>를 누릅니다.<br>2. <b>「앱 설치」</b> 또는 <b>「홈 화면에 추가」</b>를 누릅니다.<br>3. 「설치」를 누르면 앱 서랍과 홈 화면에 아이콘이 생깁니다.</p>
      <p class="muted">삼성 인터넷은 메뉴 → 「현재 페이지 추가」 → 「홈 화면」입니다.</p>`}
    <p class="muted">설치 후에는 주소창 없이 전체 화면으로 열리고, 한 번 본 위성지도는 데이터가 약해도 표시됩니다.</p>
    <div class="list"><button data-act="close">닫기</button></div>`);
}

function openMenu() {
  if (review) closeReview();
  const rd = round();
  openSheet(`<h3>메뉴</h3><div class="list">
    ${rd ? `<button data-act="card">📋 스코어카드</button>
            <button data-act="ojang">🎲 오장게임 ${rd.game ? '(진행 중 — 이어서)' : '(4인 타당 정산)'}</button>

            <button data-act="setup">📍 ${holeIdx() + 1}번홀 그린·티 위치 설정</button>
            <button data-act="finish">🏁 라운드 종료 (저장 / 기록 버리기)</button>` : ''}
    <button data-act="start">⛳ ${rd ? '다른 코스로 새 라운드' : '라운드 시작 (코스 선택)'}</button>

    <button data-act="unit">📏 단위: ${store.unit === 'm' ? '미터(m)' : '야드(yd)'} → 변경</button>
    <button data-act="backup">💾 데이터 백업/복원</button>
    ${isStandalone() ? '' : '<button data-act="install">📲 휴대폰에 앱으로 설치</button>'}
    ${window.GolfAuth ? GolfAuth.menuHtml() : ''}
    <button data-act="close">닫기</button></div>
    <p class="muted">GPS 정확도는 휴대폰·하늘 상태에 따라 보통 ±3~10m입니다. 배지가 초록색일 때 기록하세요. · 앱 버전 ${APP_VER}</p>`);
}
box.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  if (ADMIN_ACTS.has(a) && !canEdit()) { toast('골프장 추가·파 수정은 관리자만 할 수 있습니다', 2500); return; }
  if (a === 'close') closeSheet();
  else if (a === 'install') showInstall();
  else if (a === 'card') showCard(round(), course());
  else if (a === 'ojang') ojOpen();
  else if (a === 'updown') udOpen();
  else if (a === 'setup') { closeSheet(); enterSetup('c'); }
  else if (a === 'finish') endRoundSheet();
  else if (a === 'finishSave') finishRound();
  else if (a === 'finishDrop') discardRound();
  else if (a === 'start') openHome();
  else if (a === 'menu') openMenu();
  else if (a === 'quickPick') quickPick(+id);
  else if (a === 'quickGo') quickStart(+id, +document.getElementById('qFront').value, +document.getElementById('qBack').value);
  else if (a === 'homeMore') { osmState.query = document.getElementById('homeQ').value.trim(); osmSearchSheet(); }
  else if (a === 'courses') manageCourses();
  else if (a === 'history') showHistory();
  else if (a === 'unit') { store.unit = store.unit === 'm' ? 'yd' : 'm'; save(); render(); openMenu(); }
  else if (a === 'backup') showBackup();
  else if (a === 'newCourse') newCourse();
  else if (a === 'osmSearch') osmSearchSheet();
  else if (a === 'osmGo') osmRunSearch();
  else if (a === 'osmPick') osmPick(+id);
  else if (a === 'osmCreate') osmCreate();
  else if (a === 'dbPick') dbPick(+id);
  else if (a === 'dbCreate') dbCreate();
  else if (a === 'dbReset') { if (confirm('직접 수정한 파를 지우고 원래 값으로 되돌릴까요? (이미 만든 코스는 그대로)')) { delete store.dbFix[PAR_DB[+id].name]; save(); dbPick(+id); } }
  else if (a === 'ncCreate') ncCreate();
  else if (a === 'locGo') locSearch(id);
  else if (a === 'locPick') { const r = locState.results[+t.dataset.k]; if (r) setCourseCenter(id, [+r.lat, +r.lon]); }
  else if (a === 'loc') locSheet(id, store.courses[id].name);
  else if (a === 'goto') { closeSheet(); goHole(+id - holeIdx()); }
  else if (a === 'holePar') { setPar(round().courseId, holeIdx(), +id); save(); render(); holeSheet(); toast(`${holeIdx() + 1}번홀 Par ${id}로 저장`); }
  else if (a === 'holeClear') { if (confirm('이 홀의 그린·티 위치를 지울까요?')) { holeDef().green = null; holeDef().tee = null; save(); render(); holeSheet(); } }
  else if (a === 'osmManual') { closeSheet(); newCourse(osmState.picked ? osmState.picked.name : ''); }
  else if (a === 'parApply') applyQuickPar(id);

// 골프장 파 데이터 검색 — 로그인 후 서버(Supabase)에서 받아 auth.js가 setParDb로 채움(휴대폰 캐시로 오프라인 동작)
const PAR_DB = window.GOLF_PAR_DB || [];
function setParDb(list) { PAR_DB.length = 0; PAR_DB.push(...list); enforceMemberPars(); }
// 권한: 골프장 추가·파 수정은 관리자만. 일반 회원은 서버 DB 골프장으로 라운드·그린 위치 등록·기록 저장만 가능
// (서버는 RLS로 막혀 있고, 이 화면 제한은 회원 휴대폰 안의 사본까지 서버 파와 같게 유지하기 위함)
const canEdit = () => !!(window.GolfAuth && GolfAuth.isAdmin());
const ADMIN_ACTS = new Set(['newCourse', 'ncCreate', 'osmPick', 'osmCreate', 'osmManual', 'parApply', 'holePar', 'dbReset']);
function enforceMemberPars() {   // 회원 기기: 서버 DB 코스의 파를 서버 값으로 되돌리고 직접 수정값 제거
  if (canEdit() || !PAR_DB.length) return;
  let changed = !!store.dbFix;
  delete store.dbFix;
  Object.values(store.courses).forEach(c => {
    if (!c.src || !c.src.startsWith('db:') || !c.nines) return;
    const base = PAR_DB.find(x => x.name === c.src.slice(3)); if (!base) return;
    c.nines.forEach((label, half) => {
      const n = base.nines.find(x => x.label === label); if (!n) return;
      n.pars.forEach((p, k) => { const h = c.holes[half * 9 + k]; if (h && h.par !== p) { h.par = p; changed = true; } });
    });
  });
  if (changed) { save(); render(); }
}
const normName = s => String(s || '').toLowerCase().replace(/\s+/g, '')
  .replace(/(컨트리클럽|골프클럽|골프앤리조트|골프리조트|골프장|리조트|cc|gc|countryclub|golfclub)$/, '');
function searchParDb(q) {
  const k = normName(q);
  if (!k) return [];
  // 정확히 일치 > 앞부분 일치 > 포함 순으로 정렬 (DB가 커져 짧은 검색어에 여러 곳이 걸림)
  const rank = v => v === k ? 0 : v.startsWith(k) ? 1 : v.includes(k) ? 2 : (v.length >= 3 && k.startsWith(v)) ? 3 : 9;
  return PAR_DB.map((c, i) => ({ c, i, r: Math.min(...[c.name, ...(c.aliases || [])].map(n => rank(normName(n)))) }))
    .filter(x => x.r < 9).sort((a, b) => a.r - b.r || a.c.name.localeCompare(b.c.name, 'ko'))
    .map(({ c, i }) => ({ c, i }));
}

// 내장 데이터 코스의 파를 고치면 store.dbFix에 기억 → 같은 골프장으로 코스를 다시 만들 때도 수정값 사용
function dbPars(c, n) {

function setPar(cid, i, p) {

const locState = { results: [] };
async function locSearch(id) {

      const res = await fetch('https://photon.komoot.io/api/?limit=8&q=' + encodeURIComponent(q));

function findOrMakeDbCourse(c, f, b) {
  const src = 'db:' + c.name, same = Object.keys(store.courses).filter(id => store.courses[id].src === src);
  const hit = same.find(id => (store.courses[id].nines || []).join('|') === f.label + '|' + b.label);
  if (hit) return hit;
  const plain = c.nines.length === 2 && f !== b && /\bOUT\b/i.test(f.label) && /\bIN\b/i.test(b.label);
  const holes = [...dbPars(c, f), ...dbPars(c, b)].map(p => ({ par: p, green: null, tee: null }));
  [f.label, b.label].forEach((label, half) => same.forEach(id => {
    const o = store.courses[id], k = (o.nines || []).indexOf(label); if (k < 0) return;
    for (let j = 0; j < 9; j++) {
      const from = o.holes[k * 9 + j], to = holes[half * 9 + j];
      if (!to.green && from.green) to.green = JSON.parse(JSON.stringify(from.green));
      if (!to.tee && from.tee) to.tee = from.tee.slice();
    }
  }));
  const id = 'c' + Date.now();
  store.courses[id] = { name: plain ? c.name : `${c.name} ${f.label}→${b.label}`, src, nines: [f.label, b.label], holes };
  save();
  return id;
}
function quickPick(i) {

  const last = recentCourseIds().map(id => store.courses[id]).find(x => x.src === 'db:' + c.name && x.nines);
  const fi = last ? Math.max(0, c.nines.findIndex(n => n.label === last.nines[0])) : 0;
  const bi = last ? Math.max(0, c.nines.findIndex(n => n.label === last.nines[1])) : 1;
  const opt = sel => c.nines.map((n, k) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${esc(n.label)} (Par ${dbPars(c, n).reduce((s, v) => s + v, 0)})</option>`).join('');
  openSheet(`<h3>${esc(c.name)}</h3>

    ${c.verified ? '' : `<p style="color:var(--warn)">⚠️ 파 확인 필요 — 현장 스코어카드와 비교하세요.</p>`}

function quickStart(i, fk, bk) {

function greenCount(id) { return store.courses[id].holes.filter(h => h.green && h.green.c).length; }
// 쉬고 있는 라운드 = 기록이 하나도 없거나, 마지막 기록 후 3시간 경과·날짜 변경(종료를 깜빡한 경우)
// → 앱을 열면 첫 화면(골프장 검색)을 보여 주고, 새 라운드 시작 시 기록이 있으면 자동 저장
const IDLE_MS = 3 * 3600 * 1000;
const roundPlayed = rd => rd.holes.some(h => h.strokes || h.putts || h.shots.length);
function roundIsStale() {
  const rd = round(); if (!rd) return false;
  if (!roundPlayed(rd)) return true;
  const last = rd.touched || Date.parse(rd.date);
  return Date.now() - last > IDLE_MS || new Date(last).toDateString() !== new Date().toDateString();
}
function archiveStaleRound() {

function showCard(rd, c, hi) {   // hi: 지난 라운드 인덱스(있으면 홀을 눌러 궤적 다시보기)
  if (!rd || !c) return;
  const row = (from, to, label) => {
    let par = 0, st = 0, pt = 0, cells = '';
    for (let i = from; i < to; i++) {
      const p = c.holes[i].par, h = rd.holes[i];
      par += p; st += h.strokes; pt += h.putts;
      const diff = h.strokes ? h.strokes - p : null;
      cells += `<tr ${rd === round() ? `data-act="goto" data-id="${i}" style="cursor:pointer"` : hi != null && h.shots.length ? `data-act="histHole" data-id="${hi}" data-k="${i}" style="cursor:pointer"` : ''}><td>${i + 1}</td><td>${p}</td><td class="${diff < 0 ? 'under' : diff > 0 ? 'over' : ''}">${h.strokes || ''}</td>
        <td>${h.putts || ''}</td><td>${diff == null ? '' : diff > 0 ? '+' + diff : diff}</td><td>${longest(h.shots)}</td></tr>`;
    }
    return { html: cells + `<tr class="sum"><td>${label}</td><td>${par}</td><td>${st || ''}</td><td>${pt || ''}</td><td></td><td></td></tr>`, par, st, pt };
  };
  const o = row(0, 9, 'OUT'), n = row(9, 18, 'IN');
  const played = rd.holes.filter(h => h.strokes);
  const parPlayed = rd.holes.reduce((s, h, i) => s + (h.strokes ? c.holes[i].par : 0), 0);
  const tot = o.st + n.st, diff = tot - parPlayed;
  openSheet(`<h3>스코어카드 · ${esc(c.name)}</h3><p class="muted">${new Date(rd.date).toLocaleString('ko-KR')}</p>
    <table class="card"><tr><th>홀</th><th>Par</th><th>타수</th><th>퍼트</th><th>±</th><th>최장샷</th></tr>${o.html}${n.html}
    <tr class="sum"><td>합계</td><td>${o.par + n.par}</td><td>${tot || ''}</td><td>${o.pt + n.pt || ''}</td><td>${played.length ? (diff > 0 ? '+' : '') + diff : ''}</td><td></td></tr></table>
    <p class="muted">최장샷 단위: ${unitLbl()} (기록된 샷 위치 기준)${rd === round() ? ' · 홀을 누르면 그 홀로 이동해 타수·퍼트를 고칠 수 있습니다' : hi != null ? ' · 🗺️ 홀을 누르면 지도에서 샷 궤적·거리를 봅니다' : ''}</p>
    <div class="list">${rd.game ? (hi != null ? `<button data-g="histTbl" data-i="${hi}">🎲 오장게임 정산표</button>` : '<button data-act="ojang">🎲 오장게임</button>') : ''}${rd.updown ? (hi != null ? `<button data-ud="hist" data-i="${hi}">🤝 팀 업다운 결과</button>` : '<button data-act="updown">🤝 팀 업다운</button>') : ''}${hi != null ? `${hasBet(rd) ? `<button data-act="betDel" data-id="${hi}">🎲 내기 기록만 지우기 <span class="muted">· 스코어·샷은 유지</span></button>` : ''}<button data-act="history">← 지난 라운드 목록</button><button data-act="histDel" data-id="${hi}">🗑️ 이 라운드 전체 삭제</button>` : ''}<button data-act="close">닫기</button></div>`);
}
function longest(shots) {
  let m = 0;
  for (let i = 1; i < shots.length; i++) m = Math.max(m, haversine(shots[i - 1].p, shots[i].p));
  return m ? fmt(m) : '';
}

function endRoundDone(msg) {
  store.round = null; save(); closeSheet(); render(); layers.clearLayers(); toast(msg, 2200);
  setTimeout(() => { if (!round() && !sheet.classList.contains('show')) openHome(); }, 600);
}
function finishRound() {
  const rd = round(); if (!rd) return;
  store.history.unshift({ ...rd, courseSnapshot: JSON.parse(JSON.stringify(course())) });
  endRoundDone('라운드가 「지난 라운드」에 저장되었습니다');
}
function discardRound() {
  const rd = round(); if (!rd) return;
  if (roundPlayed(rd) && !confirm(`${playedHoles(rd)}홀 기록을 저장하지 않고 버릴까요?
버린 기록은 되살릴 수 없습니다.`)) return;
  endRoundDone(roundPlayed(rd) ? '기록을 버리고 라운드를 끝냈습니다' : '라운드를 끝냈습니다');
}
// 내기 게임(오장·업다운)은 그날 정산용 → 라운드 기록(스코어·샷 궤적)과 따로 지움
const hasBet = h => !!(h.game || h.updown);
function dropBet(h) { delete h.game; delete h.updown; }
function showHistory() {
  openSheet(`<h3>지난 라운드</h3><div class="list">
    ${store.history.map((h, i) => {
      const tot = h.holes.reduce((s, x) => s + x.strokes, 0), pt = h.holes.reduce((s, x) => s + x.putts, 0), n = playedHoles(h);
      return `<button data-act="histCard" data-id="${i}">${new Date(h.date).toLocaleDateString('ko-KR')} · ${esc(h.courseSnapshot.name)} · ${tot}타 / ${pt}퍼트${n < 18 ? ` <span class="muted">· ${n}홀</span>` : ''}${h.game ? ' 🎲' : ''}${h.updown ? ' 🤝' : ''}</button>`;
    }).join('') || '<p class="muted">저장된 라운드가 없습니다.</p>'}
    ${store.history.some(hasBet) ? '<button data-act="betDelAll">🎲 내기 게임 기록 모두 지우기 <span class="muted">· 스코어·샷 기록은 그대로</span></button>' : ''}
    <button data-act="close">닫기</button></div>
    <p class="muted">🎲 오장게임 · 🤝 팀 업다운 기록이 있는 라운드. 내기 기록은 그날 정산용이라 따로 지울 수 있고, 스코어·샷 궤적은 라운드를 삭제하기 전까지 남습니다.</p>`);
}
function showBackup() {
  openSheet(`<h3>데이터 백업/복원</h3>
    <p class="muted">코스(그린 좌표)와 라운드 기록은 이 휴대폰 브라우저에만 저장됩니다. 폰 교체·브라우저 데이터 삭제 전에 백업 파일을 받아두세요.</p>
    <div class="list"><button data-act="export">⬇️ 백업 파일 저장(.json)</button><button data-act="import">⬆️ 백업 파일 불러오기</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none"><button data-act="close">닫기</button></div>`);
}
function exportData() {
  const blob = new Blob([JSON.stringify(store, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `golf-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importData(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      if (!d.courses) throw new Error('형식 오류');
      if (!confirm('현재 데이터를 백업 파일 내용으로 바꿀까요?')) return;
      Object.keys(store).forEach(k => delete store[k]);
      Object.assign(store, d);
      if (!canEdit()) {   // 회원: 서버 DB 골프장만 남기고 파는 서버 값으로
        Object.keys(store.courses).forEach(id => { const s = store.courses[id].src; if (!s || !s.startsWith('db:')) delete store.courses[id]; });
        if (store.round && !store.courses[store.round.courseId]) store.round = null;
        enforceMemberPars();
      }
      save(); closeSheet(); render(); fitHole(); toast('복원 완료');
    } catch (e) { toast('불러오기 실패: 올바른 백업 파일이 아닙니다'); }
  };
  fr.readAsText(file);
}

// ---------- 유틸 ----------
function esc(s) { return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
let toastTimer;
function toast(msg, ms = 1800) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = 'none'; }, ms);
}

// 라운드 중 화면 꺼짐 방지
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* 미지원 기기 */ }
}
document.addEventListener('visibilitychange', keepAwake);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

startGps(); keepAwake(); render(); fitHole();
if (!round() || roundIsStale()) setTimeout(() => { if ((!round() || roundIsStale()) && !sheet.classList.contains('show')) openHome(); }, 400);
</script>
