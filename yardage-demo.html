<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>홀 거리 그림 시험판</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#0f1712;--fg:#f2f5f0;--mut:#9fb3a6;--acc:#5bd17d}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Malgun Gothic",sans-serif}
#top{position:fixed;left:0;right:0;top:0;z-index:1000;background:rgba(15,23,18,.92);padding:6px 8px}
#top select,#top button{font:inherit;background:#22302a;color:var(--fg);border:1px solid #3a4a41;border-radius:8px;padding:5px 8px}
#holes{display:flex;gap:4px;margin-top:6px;overflow-x:auto}#holes button{min-width:36px}
#holes button.on,.mode button.on{background:var(--acc);color:#062;border-color:var(--acc)}
#map{position:fixed;left:0;right:0;top:118px;bottom:0}
#info{position:fixed;left:8px;right:8px;bottom:8px;z-index:1000;background:rgba(15,23,18,.92);border-radius:12px;padding:8px 10px}
.mode{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mode button{font:inherit;background:#22302a;color:var(--fg);border:1px solid #3a4a41;border-radius:8px;padding:6px 9px}
.mut{color:var(--mut);font-size:13px}.big{font-size:20px;font-weight:700}
.tl{background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:6px;padding:1px 5px;font-size:12px;font-weight:700;box-shadow:none;white-space:nowrap}
.arc{background:none;border:0;color:#ffe680;font-size:11px;font-weight:700;text-shadow:0 0 3px #000;box-shadow:none}
.gps{background:rgba(30,110,255,.9);color:#fff;border:0;border-radius:6px;font-weight:700;padding:2px 6px;box-shadow:none}
.tl:before,.arc:before,.gps:before{display:none}
</style></head><body>
<div id="top">
  <select id="course"></select> <select id="nine"></select>
  <div><span id="holeTitle" class="big"></span> <span id="src" class="mut"></span></div>
  <div id="holes"></div>
</div>
<div id="map"></div>
<div id="info">
  <div id="sum"></div>
  <div class="mode">
    <button data-m="green">⛳ 그린 찍기</button><button data-m="bend">↪ 꺾임점(선택)</button><button data-m="tee">● 백티 찍기</button>
    <button id="here">📍 지금 위치로</button><button id="clr">지우기</button>
  </div>
  <div class="mut" id="help"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// 시험판: 위성사진 위에 그린·(꺾임점)·백티 경로를 두고, 티 색깔별 위치(그린에서 카드 거리만큼 경로를 따라감)·
// 그린 기준 원호·내 위치→그린 거리를 그림. OSM에 홀 선(golf=hole)이 있는 골프장은 자동, 없으면 직접 찍기.
const COURSES = [
  { name: '시그너스CC', center: [37.1750, 127.7355], data: {"name":"시그너스CC","nines":[{"label":"실크(Silk)","pars":[5,4,4,3,5,4,3,4,4],"tees":{"블루":[490,380,325,165,500,360,140,345,405],"화이트":[510,360,305,145,480,340,120,325,385],"레드":[441,283,276,122,414,291,102,302,346]}},{"label":"라미(Ramie)","pars":[4,5,3,4,4,3,5,4,4],"tees":{"블루":[355,510,200,390,425,160,535,430,375],"화이트":[335,490,165,370,405,145,515,410,355],"레드":[316,449,135,340,334,122,463,293,311]}},{"label":"코튼(Cotton)","pars":[4,5,4,5,3,4,4,3,4],"tees":{"블루":[345,450,365,470,170,300,375,170,315],"화이트":[325,450,336,433,158,272,375,146,294],"레드":[282,427,298,409,143,267,332,119,250]}}]}, osm: {"코튼(Cotton)": {"1": {"path": [[37.173234, 127.740274], [37.172293, 127.739926], [37.171488, 127.73986], [37.170991, 127.740544]], "pin": [37.170991, 127.740544]}, "2": {"path": [[37.171044, 127.739446], [37.17151, 127.738204], [37.172122, 127.73753], [37.172656, 127.737149], [37.173189, 127.737311], [37.173615, 127.738105]], "pin": [37.173615, 127.738105]}, "3": {"path": [[37.172841, 127.736265], [37.17183, 127.736563], [37.17138, 127.737122], [37.170848, 127.737922], [37.170633, 127.738584]], "pin": [37.170633, 127.738584]}, "4": {"path": [[37.170315, 127.738585], [37.170287, 127.738062], [37.170297, 127.73675], [37.17037, 127.73448], [37.170216, 127.733823]], "pin": [37.170216, 127.733823]}, "5": {"path": [[37.170704, 127.73254], [37.171287, 127.731333]], "pin": [37.171287, 127.731333]}, "6": {"path": [[37.170934, 127.730608], [37.170537, 127.731885], [37.169795, 127.733408]], "pin": [37.169795, 127.733408]}, "7": {"path": [[37.169511, 127.733867], [37.169708, 127.735632], [37.169689, 127.736723], [37.16971, 127.737949]], "pin": [37.16971, 127.737949]}, "8": {"path": [[37.170444, 127.739315], [37.170433, 127.740367], [37.170167, 127.740902]], "pin": [37.170167, 127.740902]}, "9": {"path": [[37.170794, 127.741345], [37.171866, 127.740866], [37.172549, 127.740785], [37.173155, 127.740894]], "pin": [37.173155, 127.740894]}}, "라미(Ramie)": {"1": {"path": [[37.175282, 127.740535], [37.175294, 127.738954], [37.175065, 127.737475], [37.17486, 127.736835]], "pin": [37.17486, 127.736835]}, "2": {"path": [[37.175182, 127.735908], [37.175024, 127.733518], [37.175792, 127.730553]], "pin": [37.175792, 127.730553]}, "3": {"path": [[37.175845, 127.729994], [37.177298, 127.730208]], "pin": [37.177298, 127.730208]}, "4": {"path": [[37.177503, 127.729649], [37.17476, 127.728987]], "pin": [37.17476, 127.728987]}, "5": {"path": [[37.17469, 127.730112], [37.174514, 127.73151], [37.174039, 127.732179], [37.172808, 127.732289]], "pin": [37.172808, 127.732289]}, "6": {"path": [[37.17335, 127.732793], [37.174344, 127.733801]], "pin": [37.174344, 127.733801]}, "7": {"path": [[37.174407, 127.734755], [37.173366, 127.73407], [37.172815, 127.733942], [37.171932, 127.734505], [37.170917, 127.73601]], "pin": [37.170917, 127.73601]}, "8": {"path": [[37.171269, 127.736238], [37.171886, 127.735315], [37.172727, 127.735028], [37.173333, 127.735138], [37.174053, 127.736169]], "pin": [37.174053, 127.736169]}, "9": {"path": [[37.173628, 127.736571], [37.174285, 127.737624], [37.174689, 127.738901], [37.174631, 127.740178]], "pin": [37.174631, 127.740178]}}, "실크(Silk)": {"1": {"path": [[37.176204, 127.741699], [37.177266, 127.741081], [37.178207, 127.740702], [37.179122, 127.740044], [37.179864, 127.739509]], "pin": [37.179864, 127.739509]}, "2": {"path": [[37.180046, 127.738906], [37.178891, 127.738377], [37.177905, 127.736872]], "pin": [37.177905, 127.736872]}, "3": {"path": [[37.177541, 127.736353], [37.177021, 127.734698], [37.176804, 127.733125]], "pin": [37.176804, 127.733125]}, "4": {"path": [[37.176937, 127.732507], [37.177927, 127.731609]], "pin": [37.177927, 127.731609]}, "5": {"path": [[37.17799, 127.730778], [37.17695, 127.731498], [37.176328, 127.73215], [37.175955, 127.733688], [37.175933, 127.73487]], "pin": [37.175933, 127.73487]}, "6": {"path": [[37.176432, 127.735563], [37.177376, 127.737478], [37.177988, 127.738675]], "pin": [37.177988, 127.738675]}, "7": {"path": [[37.178789, 127.739296], [37.177692, 127.739905]], "pin": [37.177692, 127.739905]}, "8": {"path": [[37.177139, 127.739038], [37.175895, 127.735743]], "pin": [37.175895, 127.735743]}, "9": {"path": [[37.175522, 127.736602], [37.176055, 127.738581], [37.176033, 127.739501], [37.175779, 127.74061]], "pin": [37.175779, 127.74061]}}} },
  { name: '레이크우드CC', center: [37.7806, 127.0880], data: {"name":"레이크우드CC","nines":[{"label":"물길","pars":[4,4,3,5,4,3,5,4,4],"tees":{"레드":[288,283,122,447,300,118,431,308,284],"골드":[302,299,147,486,357,135,455,354,334],"실버":[null,null,null,503,null,null,null,null,365],"화이트":[311,313,165,523,380,158,476,368,379],"블루":[332,325,185,537,392,175,495,384,400]}},{"label":"꽃길","pars":[4,4,3,4,4,5,3,5,4],"tees":{"레드":[318,289,90,317,317,428,137,437,290],"골드":[335,306,105,340,359,447,159,488,306],"실버":[null,null,119,null,null,467,174,507,null],"화이트":[350,323,128,351,378,490,188,520,319],"블루":[365,343,145,363,393,506,201,533,332]}},{"label":"산길","pars":[5,3,4,4,3,4,5,4,4],"tees":{"레드":[430,80,259,277,121,233,360,276,281],"골드":[480,94,315,305,144,294,442,333,319],"화이트":[510,117,329,332,166,315,472,367,345],"블루":[524,133,350,358,182,334,485,385,364]}},{"label":"숲길","pars":[4,5,3,4,4,5,4,3,4],"tees":{"레드":[268,342,95,273,273,394,216,104,307],"골드":[291,393,115,321,304,431,271,133,336],"실버":[null,455,null,378,385,468,327,null,354],"화이트":[377,482,141,400,404,494,351,155,381],"블루":[390,501,160,420,424,513,370,175,402]}}]}, osm: null }
];
const TEE_DOT = { 블랙: '#222', 골드: '#c9a227', 블루: '#2f6fe0', 화이트: '#ffffff', 실버: '#b8bec6', 옐로: '#f2c500', 그린: '#3cb45a', 레드: '#e0342f' };
const KEY = 'yd-demo-v2';
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { store = {}; }
const saveStore = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* 저장 불가 환경 */ } };
let ci = 0, nineI = 0, hole = 0, mode = 'green', me = null;
try { ci = Math.max(0, COURSES.findIndex(c => c.name === localStorage.getItem(KEY + '-course'))); } catch (e) { ci = 0; }
const $ = id => document.getElementById(id);
const C = () => COURSES[ci], N = () => C().data.nines[nineI];

const map = L.map('map', { zoomControl: false, attributionControl: false }).setView(C().center, 16);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19 }).addTo(map);
const layer = L.layerGroup().addTo(map);

const R = 6371008.8, rad = Math.PI / 180;
function dist(a, b) {
  const dLa = (b[0] - a[0]) * rad, dLo = (b[1] - a[1]) * rad;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
function pathLen(p) { let s = 0; for (let i = 1; i < p.length; i++) s += dist(p[i - 1], p[i]); return s; }
function pointFromGreen(p, d) {   // p = [그린, 꺾임점들…, 백티] — 그린에서 경로를 따라 d m 지점 (경로보다 길면 마지막 구간 연장)
  let left = d;
  for (let i = 1; i < p.length; i++) {
    const seg = dist(p[i - 1], p[i]);
    if (left <= seg || i === p.length - 1) return lerp(p[i - 1], p[i], left / seg);
    left -= seg;
  }
  return p[0];
}
function circle(c, r) {
  const pts = [];
  for (let a = 0; a <= 360; a += 6) { const t = a * rad; pts.push([c[0] + (r * Math.cos(t)) / 111320, c[1] + (r * Math.sin(t)) / (111320 * Math.cos(c[0] * rad))]); }
  return pts;
}
const hk = () => C().name + '|' + N().label + '|' + hole;
const hd = () => store[hk()] || (store[hk()] = {});
function osmHole() { const o = C().osm && C().osm[N().label]; return o && o[hole + 1]; }
// 경로: 직접 찍은 값 우선, 없으면 OSM(티→그린 선을 그린 쪽부터 뒤집음)
function route() {
  const h = hd(), o = osmHole();
  const og = o ? o.pin : null, ot = o ? o.path[0] : null, ob = o ? o.path.slice(1, -1).reverse() : [];
  const green = h.green || og, tee = h.tee || ot;
  const bends = h.bend ? [h.bend] : ob;
  return { green, tee, path: green && tee ? [green, ...bends, tee] : null, manual: !!(h.green || h.tee || h.bend), osm: !!o };
}
const dot = t => `<i style="display:inline-block;width:.75em;height:.75em;border-radius:50%;border:1px solid #888;background:${TEE_DOT[t] || '#aaa'}"></i>`;

function render() {
  const n = N(), r = route();
  $('holeTitle').textContent = `${hole + 1}번홀 · Par ${n.pars[hole]}`;
  $('src').textContent = r.manual ? '(직접 찍은 위치)' : r.osm ? '(OSM 지도 자동)' : '';
  document.querySelectorAll('#holes button').forEach((b, i) => b.classList.toggle('on', i === hole));
  document.querySelectorAll('.mode [data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
  layer.clearLayers();
  const tees = Object.entries(n.tees || {}).filter(([, a]) => a[hole] != null).sort((a, b) => b[1][hole] - a[1][hole]);
  let html = tees.map(([t, a]) => `<span style="white-space:nowrap">${dot(t)} ${t} <b>${a[hole]}m</b></span>`).join(' · ');
  if (r.green) {
    L.marker(r.green, { icon: L.divIcon({ html: '⛳', className: '', iconSize: [24, 24], iconAnchor: [6, 22] }) }).addTo(layer);
    for (const d of [50, 100, 150, 200, 250]) L.polyline(circle(r.green, d), { color: '#ffe680', weight: 1, opacity: 0.7, dashArray: '4 6' }).addTo(layer);
  }
  if (r.path) {
    const p = r.path, len = pathLen(p);
    L.polyline(p, { color: '#ffffff', weight: 2, opacity: 0.85 }).addTo(layer);
    for (const d of [50, 100, 150, 200, 250]) if (d < len) {
      L.tooltip({ permanent: true, direction: 'right', className: 'arc', offset: [4, 0] }).setLatLng(pointFromGreen(p, d)).setContent(String(d)).addTo(layer);
    }
    tees.forEach(([t, a], i) => {
      L.circleMarker(pointFromGreen(p, a[hole]), { radius: 7, color: '#000', weight: 1.5, fillColor: TEE_DOT[t] || '#aaa', fillOpacity: 1 }).addTo(layer)
        .bindTooltip(`${t} ${a[hole]}m`, { permanent: true, direction: i % 2 ? 'left' : 'right', className: 'tl', offset: [i % 2 ? -8 : 8, (Math.floor(i / 2) - (tees.length - 1) / 4) * 18] });
    });
    const back = tees[0];
    html += `<div class="mut">지도 선 길이 ${Math.round(len)}m · 카드 ${back ? back[0] + ' ' + back[1][hole] + 'm' : ''}${back && back[1][hole] > len + 5 ? ' — 선보다 긴 티는 선을 연장한 위치' : ''}</div>`;
  }
  if (me) {
    L.circleMarker(me, { radius: 8, color: '#fff', weight: 2, fillColor: '#1e6eff', fillOpacity: 1 }).addTo(layer);
    if (r.green) {
      L.polyline([me, r.green], { color: '#4aa3ff', weight: 2, dashArray: '6 6' }).addTo(layer);
      L.tooltip({ permanent: true, direction: 'top', className: 'gps', offset: [0, -8] }).setLatLng(me).setContent('그린까지 ' + Math.round(dist(me, r.green)) + 'm').addTo(layer);
    }
  }
  $('sum').innerHTML = html;
  $('help').textContent = !r.green ? '① 위성사진에서 그린 가운데를 탭하세요 (그린에 서 있다면 「지금 위치로」)'
    : !r.tee ? '② 가장 뒤 티박스를 탭하세요 — 도그렉이면 먼저 「꺾임점」을 고르고 휘는 지점을 탭'
    : r.manual ? '다시 찍으려면 버튼을 고르고 탭 · 「지우기」는 이 홀을 처음 상태로'
    : '위치가 실제와 다르면 버튼을 고르고 탭해서 고칠 수 있습니다(이 휴대폰에만 저장)';
}
function fit() {
  const r = route(), pts = r.path || [r.green].filter(Boolean);
  if (pts.length >= 2) map.fitBounds(pts, { paddingTopLeft: [30, 30], paddingBottomRight: [30, 230] });
  else if (pts.length) map.setView(pts[0], 18);
  else map.setView(C().center, 16);
}
function setPoint(p) {
  const h = hd(); h[mode] = p; saveStore();
  if (mode !== 'tee' && !route().tee) mode = 'tee';
  render();
}
map.on('click', e => setPoint([e.latlng.lat, e.latlng.lng]));
document.querySelectorAll('.mode [data-m]').forEach(b => { b.onclick = () => { mode = b.dataset.m; render(); }; });
$('here').onclick = () => { if (me) { setPoint(me.slice()); map.setView(me, 18); } else alert('아직 GPS 위치를 받지 못했습니다'); };
$('clr').onclick = () => { if (confirm('이 홀에 직접 찍은 위치를 지울까요?')) { store[hk()] = {}; saveStore(); mode = 'green'; render(); fit(); } };
const pickHole = i => { hole = i; mode = route().green ? 'tee' : 'green'; render(); fit(); };
function fillNines() { $('nine').innerHTML = ''; C().data.nines.forEach((n, i) => $('nine').add(new Option(n.label + ' 코스', i))); }
COURSES.forEach((c, i) => $('course').add(new Option(c.name, i)));
$('course').value = ci;
$('course').onchange = e => { ci = +e.target.value; try { localStorage.setItem(KEY + '-course', C().name); } catch (x) { /* 무시 */ } nineI = 0; fillNines(); pickHole(0); };
$('nine').onchange = e => { nineI = +e.target.value; pickHole(0); };
for (let i = 0; i < 9; i++) { const b = document.createElement('button'); b.textContent = i + 1; b.onclick = () => pickHole(i); $('holes').appendChild(b); }
if (navigator.geolocation) navigator.geolocation.watchPosition(pos => { me = [pos.coords.latitude, pos.coords.longitude]; render(); }, () => {}, { enableHighAccuracy: true, maximumAge: 2000 });
fillNines(); pickHole(0);
</script>
</body></html>
